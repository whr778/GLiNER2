[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gliner2", "gliner2.*"]

[tool.setuptools.package-data]
gliner2 = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "gliner2.__version__"}

[project]
name = "gliner2"
description = "GLiNER2: Unified Schema-Based Information Extraction and Text Classification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"

maintainers = [
    {name = "Urchade Zaratiana"},
]

classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "anthropic>=0.120.2",
    "datasets>=3.1.0",
    "gliner",
    "huggingface_hub",
    # Supplies FlashAttention 2 through the Hub kernel registry. Prebuilt flash-attn
    # wheels stop at cp313/torch2.9, so on torch 2.11+cu128 this is the only way to
    # get FA2 -- and for the boundary architecture FA2 is required for correctness,
    # not just speed: sdpa+bf16 on mmBERT goes non-finite (measured, 1x H100).
    # Range is transformers' own constraint; 0.16 breaks its import.
    "kernels>=0.12,<0.13",
    "langcodes[data]",
    "lumi-language-id-2",
    "numpy",
    "openai>=2.53.0",
    "peft",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.28",
    "safetensors",
    "stopwordsiso>=0.7.0",
    "tqdm",
    "urllib3>=1.26",
]

dynamic = ["version"]

[project.optional-dependencies]
local = [
    "torch",
    "transformers",
    "peft",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that load or download models or are otherwise slow",
    "quality: checkpoint-dependent inference quality expectations",
    "compile: torch.compile / export-path tests (platform dependent)",
]

[project.urls]
Homepage = "https://github.com/fastino-ai/GLiNER2"
Repository = "https://github.com/fastino-ai/GLiNER2"

[dependency-groups]
dev = [
    "datasets>=2.14",
    "pytest>=7.0",
    "pytest-timeout>=2.1",
]
