[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gliner2", "gliner2.*"]

[tool.setuptools.package-data]
gliner2 = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "gliner2.__version__"}

[project]
name = "gliner2"
description = "GLiNER2: Unified Schema-Based Information Extraction and Text Classification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"

maintainers = [
    {name = "Urchade Zaratiana"},
]

classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "anthropic>=0.120.2",
    "datasets>=3.1.0",
    "gliner",
    "huggingface_hub",
    # Supplies FlashAttention 2 through the Hub kernel registry. Prebuilt flash-attn
    # wheels stop at cp313/torch2.9, so on torch 2.11+cu128 this is the only way to
    # get FA2 -- and for the boundary architecture FA2 is required for correctness,
    # not just speed: sdpa+bf16 on mmBERT goes non-finite (measured, 1x H100).
    # kernels is pinned to TRANSFORMERS, not to itself: the compatible range moves with
    # every transformers release. transformers 5.6 needs <0.13 (LayerRepository takes no
    # revision); 5.13+ needs >=0.15.2 and REJECTS 0.12. The two ranges are disjoint, so
    # they are pinned TOGETHER, here, in the BASE dependencies -- see the note on
    # transformers below for why the pin cannot live in an extra.
    #
    # It drifted on 2026-08-10 and cost a GPU run: a fresh box resolved transformers to
    # 5.13 while this pin still said <0.13, kernels never hooked, the encoder fell back to
    # sdpa, and bf16 ModernBERT went non-finite at ~step 50 after running 11x slow
    # (4.6 vs 51.4 samples/s). The only warning was one RuntimeWarning in the log.
    #
    # BUMPED 2026-09-14, and this one was FORCED rather than chosen. The org announced:
    # "Starting from September 13, 2026, we will be removing the 'model' type repositories
    # of kernels". On 0.12 every fetch of kernels-community/flash-attn2 then 404s -- and
    # it 404s to a VALID TOKEN, under every standard repo_type, because the repo is now a
    # new `kernel` type that only kernels>=0.15.2 understands. Measured: boundary CUDA
    # TRAINING aborted at step 0 on 14 Sep having run fine on 8 Sep, with no code change
    # between. On 0.17 the same repo resolves and publishes
    # `torch211-cxx11-cu128-x86_64-linux` -- exactly the Lambda stack.
    # 0.16.x AND NOTHING ELSE while transformers is 5.16. A loose upper bound is not a
    # pin: I wrote >=0.15.2,<0.18 on 2026-09-14, uv resolved 0.17.0, and transformers
    # 5.16.1 rejected it -- "Please install a compatible version (0.16.0 <= version <
    # 0.17.0)". The encoder fell back to sdpa and 42 minutes of training per arm ran on a
    # backend that is a CORRECTNESS failure here, then the blind test died. Same defect
    # this comment has warned about since 2026-08-10, committed by the person fixing it.
    "kernels>=0.16,<0.17",
    # PINNED HERE, IN THE BASE DEPS, NOT IN THE `local` EXTRA. It lived in the extra until
    # 2026-09-14, and the GPU boxes install with `uv sync --no-install-project`, which does
    # not take extras -- so the one dependency the comment above calls load-bearing was
    # unpinned on exactly the machines it was written to protect. uv.lock held them
    # together in practice; nothing but the lockfile did.
    "transformers>=5.13,<5.18",
    "langcodes[data]",
    "lumi-language-id-2",
    # Mac-only: Metal FlashAttention for MPS. Marker-guarded because this package
    # does not install on the Linux CUDA boxes the training runs use, and an
    # unconditional entry here would break `uv sync` there.
    "mps-flash-attn>=0.6.1; sys_platform == 'darwin'",
    "numpy",
    "openai>=2.53.0",
    "peft",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.28",
    "safetensors",
    "stopwordsiso>=0.7.0",
    # transformers >=5.16 needs these to build the DeBERTa-v2/v3 slow tokenizer, and it
    # reports their absence as a BARE ImportError WITH AN EMPTY MESSAGE -- three real-
    # encoder e2e tests failed saying nothing at all until the import was traced by hand.
    # Not optional for us: every deberta-v3 checkpoint needs that tokenizer.
    #
    # tiktoken is named in the same backend check and is a TRAP: installing it alone makes
    # the converter take the tiktoken path and try to parse `spm.model` as a tiktoken
    # vocabulary ("Error parsing line b'\x0e'"), which reads like corruption rather than a
    # missing package. sentencepiece is the one that matters.
    "sentencepiece>=0.2",
    "protobuf",
    "tqdm",
    "urllib3>=1.26",
    "lxml>=6.1.3",
]

dynamic = ["version"]

[project.optional-dependencies]
local = [
    "torch",
    # The transformers pin moved to the BASE dependencies on 2026-09-14 so it reaches the
    # GPU boxes, which install without extras. Kept out of here deliberately: two pins for
    # one package is how they drift apart.
    "peft",
    "stopwordsiso",
    "langcodes",
]

[tool.pytest.ini_options]
# tests/ is not a package, but conftest.py imports `tests.fixtures`, so the repo
# root must be importable. Without this, plain `pytest` dies at collection with
# ModuleNotFoundError: No module named 'tests' and only `python -m pytest` works.
pythonpath = ["."]
markers = [
    "slow: end-to-end tests that load or download models or are otherwise slow",
    "quality: checkpoint-dependent inference quality expectations",
    "compile: torch.compile / export-path tests (platform dependent)",
]

[project.urls]
Homepage = "https://github.com/fastino-ai/GLiNER2"
Repository = "https://github.com/fastino-ai/GLiNER2"

[dependency-groups]
dev = [
    "datasets>=2.14",
    "pytest>=7.0",
    "pytest-timeout>=2.1",
]
