[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gliner2", "gliner2.*"]

[tool.setuptools.package-data]
gliner2 = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "gliner2.__version__"}

[project]
name = "gliner2"
description = "GLiNER2: Unified Schema-Based Information Extraction and Text Classification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"

maintainers = [
    {name = "Urchade Zaratiana"},
]

classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "anthropic>=0.120.2",
    "datasets>=3.1.0",
    "gliner",
    "huggingface_hub",
    # Supplies FlashAttention 2 through the Hub kernel registry. Prebuilt flash-attn
    # wheels stop at cp313/torch2.9, so on torch 2.11+cu128 this is the only way to
    # get FA2 -- and for the boundary architecture FA2 is required for correctness,
    # not just speed: sdpa+bf16 on mmBERT goes non-finite (measured, 1x H100).
    # kernels is pinned to TRANSFORMERS, not to itself: the compatible range moves with
    # every transformers release. transformers 5.6 needs <0.13 (LayerRepository takes no
    # revision); 5.13 needs >=0.15.2 and REJECTS 0.12. The two ranges are disjoint, so
    # transformers must be pinned alongside it or the pair silently drifts apart.
    #
    # It drifted on 2026-08-10 and cost a GPU run: a fresh box resolved transformers to
    # 5.13 while this pin still said <0.13, kernels never hooked, the encoder fell back to
    # sdpa, and bf16 ModernBERT went non-finite at ~step 50 after running 11x slow
    # (4.6 vs 51.4 samples/s). The only warning was one RuntimeWarning in the log.
    "kernels>=0.12,<0.13",
    "langcodes[data]",
    "lumi-language-id-2",
    # Mac-only: Metal FlashAttention for MPS. Marker-guarded because this package
    # does not install on the Linux CUDA boxes the training runs use, and an
    # unconditional entry here would break `uv sync` there.
    "mps-flash-attn>=0.6.1; sys_platform == 'darwin'",
    "numpy",
    "openai>=2.53.0",
    "peft",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.28",
    "safetensors",
    "stopwordsiso>=0.7.0",
    "tqdm",
    "urllib3>=1.26",
]

dynamic = ["version"]

[project.optional-dependencies]
local = [
    "torch",
    # Pinned, and pinned TOGETHER with kernels above. Leaving this open is what broke
    # the 2026-08-10 GPU run: a fresh box resolved 5.13 while the kernels pin still
    # matched 5.6, so FA2 never hooked and bf16 ModernBERT went non-finite. Moving this
    # range REQUIRES moving the kernels range in the same commit.
    "transformers>=5.6,<5.7",
    "peft",
]

[tool.pytest.ini_options]
# tests/ is not a package, but conftest.py imports `tests.fixtures`, so the repo
# root must be importable. Without this, plain `pytest` dies at collection with
# ModuleNotFoundError: No module named 'tests' and only `python -m pytest` works.
pythonpath = ["."]
markers = [
    "slow: end-to-end tests that load or download models or are otherwise slow",
    "quality: checkpoint-dependent inference quality expectations",
    "compile: torch.compile / export-path tests (platform dependent)",
]

[project.urls]
Homepage = "https://github.com/fastino-ai/GLiNER2"
Repository = "https://github.com/fastino-ai/GLiNER2"

[dependency-groups]
dev = [
    "datasets>=2.14",
    "pytest>=7.0",
    "pytest-timeout>=2.1",
]
