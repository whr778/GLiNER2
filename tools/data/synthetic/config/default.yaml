# Synthetic base-training data generation config.
# Override any of these at the CLI (--provider, --model, --count, --tasks, --out).

provider:
  provider: openai        # openai | anthropic | mock
  model: gpt-4o           # e.g. gpt-4o, gpt-4.1-mini, claude-sonnet-5, claude-haiku-4.5
  temperature: 0.9        # higher -> more diverse documents
  max_tokens: 2048        # cap on the generated document + annotations

generation:
  count: 1000             # documents to generate (CLI --count overrides)
  tasks:                  # which task types to annotate per document
    - entities
    - relations
    - events
    - classifications
    - structures
  min_words: 180          # target document length (words)
  max_words: 320
  domains: []             # [] = rotate all built-in domains; or list a subset

split:
  ratios: [0.8, 0.1, 0.1] # train / val / test (CLI --split-ratios overrides)
  seed: 42

cost:                     # per-record token assumptions for --estimate
  est_input_tokens: 1600  # system + full ontology prompt
  est_output_tokens: 1400 # generated document + all-task JSON annotations
