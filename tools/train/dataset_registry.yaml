    source_url: https://github.com/tongmeihan1995/docee
    hf_jsonl: whr778/docee
    language: [en]
    description: "Document-level event extraction; one event per document mapped to role-typed entities and document classification. SPLITS ARE REPAIRED: upstream normal_setting overlaps itself (56 train/val, 12 train/test, 26 val/test documents, plus 84 duplicates inside one split) and the converter honours it 1:1, so dedupe_splits.py runs after conversion with precedence test > val > train. 21,842 / 2,721 / 2,744 after repair, from 21,966 / 2,748 / 2,771."
  chfinann:
