  casualty_docee:
    name: Multi-event casualty corpus, DocEE-conditioned
    tasks: structured extraction (json_structures, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_docee
    source_url: null
    language: [en]
    description: "Realistic counterpart of casualty_multi. Synthetic stream trajectories (exact ground truth) are paired with REAL DocEE contexts -- actual event types and place names from 6,929 annotated articles -- and realized by claude-sonnet-5, so each stream reads as a different real disaster in a named place instead of a templated earthquake in 'the region'. Magnitudes are rescaled per event type (scale_streams_to_type.py) because the generator's single large-disaster regime made 80% of type pairings implausible (a road crash peaking at 52,447). Split at the STREAM level so no incident straddles train/val/test."

  warmstart_mix:
    name: Warm-start mixture (structure + NER + replay)
    tasks: mixed -- json_structures, NER, events, relations
    license: see constituent corpora
    hf_id: null
    source_url: null
    hf_jsonl: whr778/warmstart_mix
    language: [en, zh]
    description: "Derived mixture, not a source corpus: built by tools/train/build_warmstart_mix.py to add STRUCTURE and NER to a trained joint-boundary checkpoint without losing what it already does. 70% new (casualty_multi_loc structure + pile_ner_def/nuner_full NER, split evenly rather than by pool size so definition-bearing NER is not buried 20:1) and 30% replay sampled from the 137K pool at its own 73/27 event/relation ratio. Documents are capped at 2,000 chars: step cost is superlinear in sequence length and text2json alone is 30.6% over 4,000 chars (max 102,068), which cost 1.87x throughput for records the pools can replace with shorter ones. Pre-shuffled at the example level so every batch is a mixture rather than a task block. Licensing is that of the constituent corpora."

  mix_natural:
    hf_jsonl: whr778/mix_natural
    name: Warm-start mixture, record mode = natural
    tasks: mixed -- json_structures (mode=natural), NER, events, relations
    license: see constituent corpora
    hf_id: null
    source_url: null
    language: [en, zh]
    description: "warmstart_mix whose casualty records declare mode=natural (anchor defaults to the first declared field, a casualty figure). One arm of the record-mode A/B; byte-identical to mix_anchorless with record_metadata stripped, verified by content hash, so the mode is the only variable. Declaring a mode is not cosmetic: without record_metadata the BOUNDARY record path is never supervised, which is why an earlier run produced correct multi-instance records with location empty every time. This arm fills location 6/9 where every prior configuration filled 0/9."

  mix_anchorless:
    name: Warm-start mixture, record mode = anchorless
    tasks: mixed -- json_structures (mode=anchorless), NER, events, relations
    license: see constituent corpora
    hf_id: null
    source_url: null
    hf_jsonl: whr778/mix_anchorless
    language: [en, zh]
    description: "warmstart_mix whose casualty records declare mode=anchorless -- instances formed with no anchor mention. The losing arm of the record-mode A/B: 1/9 instances and 0/9 location fills, versus 7/9 and 6/9 for mix_natural, on identical data. Retained for provenance because the result is informative rather than a failed build: a casualty record appears to genuinely HAVE a natural anchor (the figure itself), so removing it leaves nothing to key instances on."

  cas_ann_en:
    name: cas_ann_en (real English news casualty structures)
    tasks: structure extraction (casualty_report)
    license: inherits DocEE
    source_url: DocEE, annotated by tools/data/annotate_casualty.py
    hf_jsonl: whr778/cas_ann_en
    language: [en]
    description: "9,648 casualty_report records over REAL English news, the first real-text English casualty corpus in this repo -- every other English casualty corpus is LLM-generated. Bought 2026-09-03 for ~$20 from 14,850 DocEE documents screened by the free toll regex (53.0% of DocEE carries a casualty label; the regex lifts purity to 53.0% at 95.5% recall). Yield 65.0%, 0 errored, 78.5% verbatim retention, 0 duplicate documents. Field fills: location 13,777, dead 10,101, injured 3,414, missing 534. Candidates carry a source tag (docee-train/val/test) because the 137k base TRAINED on docee.train -- a casualty test split must be carved from the val/test rows or the blind test is not blind. Feeds casualty_ml."
  short_form_probe:
    name: short_form_probe (register probe for pseudo-perplexity)
    tasks: none -- unlabelled text, measurement only
    license: inherits community-datasets/disaster_response_messages
    source_url: community-datasets/disaster_response_messages (HF), train split
    hf_jsonl: whr778/short_form_probe
    language: [en]
    description: "400 unedited short-form disaster messages over 60 characters. Not training data: it is the held-out register cell in tools/train/base_model_perplexity.py, and the only one that is not edited prose. mmBERT-base scores 29.52 pseudo-perplexity here against 4.67 on real news, which is the measurement behind the claim that the stage-0 SMS gate failure is partly REPRESENTATIONAL and not only a provenance confound. Mirrored because it lived on a temp volume until 2026-09-03, which would have made a published number unrepeatable."
  casualty_ml:
    name: casualty_ml (language-balanced casualty structures)
    tasks: structure extraction (casualty_report)
    license: mixed -- inherits casualty_natural, the Turkish news pool and shaowenchen/news_zh
    source_url: built by tools/train/build_casualty_multilingual.py
    hf_jsonl: whr778/casualty_ml
    language: [en, tr, zh]
    description: "62,703 casualty_report records balanced at 20,901 per language, ALL REAL NEWS: English (cas_ann_en from DocEE plus cas_ann_ccnews from CC-News, 22,139 available), Turkish (turkish_gate/cas_ann_tr, 31,263) and Simplified Chinese (chinese_gate/cas_ann_zh*, 20,901). Downsampled to the smallest language so no arm wins on volume. The English arm was synthetic (casualty_natural) until the two English purchases landed on 2026-09-03; the balance held by construction when it was swapped in. 100% carry record_metadata, which the BOUNDARY record head requires and whose absence fails silently -- and whose ANCHOR must name a field the row actually carries: the annotator stamped a fixed 'dead' on every purchased row, 14,068 of 54,303 train rows did not carry it, and training died at step 0 until tools/data/repair_casualty_anchors.py fixed the sources and the builder gained a gate. Verified on the shipped build: 54,303 / 4,200 / 4,200, 0 duplicates within each split, 0 overlap across splits, 33.0/33.5/33.5 per language in train, val AND test (an unbalanced test set would let a monolingual model score well), 0 broken anchors, and 0 of the 6,247 base-seen English rows in val or test."
  casualty_multi:
    name: Multi-event casualty-report corpus
    tasks: structured extraction (json_structures, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_multi
    source_url: null
    language: [en]
    description: "Multi-event counterpart of casualty_ft for the EKF/MHT streaming line. Built by datasets/disaster_streams/build_multievent_corpus.py from the sonnet5 TRAIN streams only: each document concatenates 1-4 snippets drawn from DIFFERENT streams and carries one casualty_report instance per snippet (29,030 docs / 67,799 instances, mean 2.34). Values are located within their own snippet's slice and dropped when ambiguous across the document, so no instance is labelled with another event's number. Exists because casualty_ft is 100% single-instance, which trained the count head to always predict 1 and collapsed value binding to 0.369 on multi-event text."

  casualty_ft:
    name: Casualty-report fine-tune corpus
    tasks: structured extraction (json_structures)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_ft
    source_url: null
    language: [en]
    description: "Locally generated casualty_report structure corpus for the EKF/MHT streaming line. Built by datasets/disaster_streams/build_finetune_corpus.py from Claude Sonnet 5 realizations of synthetic disaster streams; each report snippet becomes one instance whose roles carry the ground-truth figure verbatim as it appears in the text (comma form preserved), training the extractor to bind numbers to roles."
  casualty_loc_split:
    name: Multi-event casualty corpus with location, leak-free splits
    tasks: structured extraction (json_structures, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_loc_split
    source_url: null
    language: [en]
    description: "casualty_multi_loc rebuilt with train/val/test rather than train only, for the Track A gate (does location supervision fix number-to-place binding on real news?). Built by build_multievent_corpus.py from disaster_streams_docee250 + contexts250.json. 23,744 / 2,704 / 2,873 documents (200/25/25 streams), mean 2.48 instances per document, location located 92%; absent gets no location rather than a guess. SPLITS ARE PLACE-DISJOINT as of 2026-08-17 (39df136): a contiguous index slice could not express that, because 26 DocEE places are drawn by more than one stream, so the split moved to --streams-file over connected groups of streams linked on every string the builder can emit (the place and each comma-separated component) -- 199 groups, largest 7 streams. Clean on all three axes: 0 duplicate documents within a split and 0 across, streams disjoint, 0 shared location strings between any pair. An earlier build sliced 0/200/225/250 and left 57.2% of test documents naming a place also in train; those numbers (23,239 / 2,878 / 3,201) are superseded. The stream partition is recorded in datasets/disaster_streams_docee250/splits/ and reproduces the shipped jsonl byte-identically (re-verified 2026-08-19)."
  casualty_loc_muted:
    name: Multi-event casualty corpus with WITHHELD interference records
    tasks: structured extraction (json_structures, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_loc_muted
    source_url: null
    language: [en]
    description: "casualty_loc_split with negative supervision on event identity, for TODO item 2 (cross-event contamination, 4.7% of Helene observations and the largest values). Built 2026-08-19 by build_multievent_corpus.py --mute-interference-prob 0.35 on the same streams, contexts and splits, so casualty_loc_split IS the control: every muted document's text is present in it (0 absent), 9,669 documents carry strictly fewer records, and none carry more. 23,713 / 2,704 / 2,873 documents; val and test are built at prob 0.0 and are byte-identical to the control's. 9,765 train documents (41.2%) hold a muted snippet and 14,955 figures are delivered unlabelled -- the first casualty corpus in which the model is shown a casualty figure it is supposed to leave alone (measured: 0.0% of documents in every earlier corpus). The 31 documents the control has and this lacks are focal-collision cases where every interference record was also muted; they are dropped rather than emitted with empty gold. TWO LIMITS, declared. (1) The focal snippet is parts[0], so muting is learnable from POSITION alone; score casualty_loc_probe_focal_last before reading any gain as event identity. (2) The corpus carries 8 event TYPES and no named identities, so what it can teach is 'this figure belongs to a different incident' by place and type, not 'Helene versus Katrina' by name."
  casualty_loc_probe_focal_last:
    name: Focal-last position probe for the muting arm
    tasks: structured extraction (json_structures, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_loc_probe_focal_last
    source_url: null
    language: [en]
    description: "TEST SPLIT ONLY, and a control rather than training data -- never put it in data.corpora. The casualty_loc_split test streams rebuilt with --focal-position last, so the focal snippet sits at the END of each document and everything else is unchanged. It pairs with the ordinary test split document for document: same 2,873 documents, same 7,058 instances, identical gold, only the snippet order differs. A model that learned 'report the first paragraph' scores near zero here; a model that learned event identity does not. Score the 2,168 documents that actually reordered -- the remaining 705 are single-snippet (k=0) and are byte-identical to the ordinary test split, so including them dilutes the contrast."
  casualty_events:
    name: Multi-event casualty corpus, EVENTS form
    tasks: event extraction (trigger + typed arguments, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_events
    source_url: null
    language: [en]
    description: "The same documents, splits and figures as casualty_loc_split, re-emitted as trigger + typed arguments instead of anchored json_structures records, for Track B: does the EVENT formulation bind figures better than the structure one? Built by build_multievent_corpus.py --emit events. 23,627 / 2,666 / 2,852 documents, mean ~2.4 instances, 8 event types, 57,726 triggers and 124,561 arguments all verbatim in their own document. TRIGGERS ARE DERIVED, NOT GOLD: DocEE gives a type and never a span, so _locate_trigger matches a per-type surface list inside the snippet's own slice -- 97.6% coverage, worst type Road Crash at 8.7% missing. A gain here is a gain over that trigger definition. The corpus carries 8 event TYPES and no named identities, so it can teach trigger->argument binding and cannot teach same-type discrimination (Helene vs Katrina), which is the live defect in TODO item 2."
  casualty_multi_loc:
    name: Multi-event casualty corpus with gold location field
    tasks: structured extraction (json_structures, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_multi_loc
    source_url: null
    language: [en]
    description: "casualty_docee carrying a gold `location` field per instance, added because a numeric-only schema collapses -- asked for a location the casualty fine-tune returns the number. Location is located verbatim in 84.7% of snippets, +8.3% by component, 7.0% absent (absent gets no location rather than a guess). TRAIN SPLIT ONLY, and consumed by build_warmstart_mix.py as one of two STRUCTURE_DEFAULT corpora; use casualty_loc_split where val/test are needed."
  casualty_natural:
    name: Casualty records, record mode = natural
    tasks: structured extraction (json_structures, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_natural
    source_url: null
    language: [en]
    description: "Casualty records declaring record_metadata mode=natural, the anchored arm of the record-mode A/B (anchor defaults to the first declared field, a casualty figure). Train split only. Declaring a mode is not cosmetic on the boundary architecture: without record_metadata the record path is never supervised, which is why an earlier run produced correct multi-instance records with location empty every time."
  casualty_anchorless:
    name: Casualty records, record mode = anchorless
    tasks: structured extraction (json_structures, multi-instance)
    license: see source
    hf_id: null
    hf_jsonl: whr778/casualty_anchorless
    source_url: null
    language: [en]
    description: "The anchorless counterpart to casualty_natural: byte-identical with record_metadata stripped, verified by content hash, so the mode is the only variable. The losing arm -- 1/9 instances and 0/9 location fills against 7/9 and 6/9 for the natural arm on identical data. Retained because the result is informative: a casualty record genuinely has a natural anchor (the figure itself), so removing it leaves nothing to key instances on. Train split only."
