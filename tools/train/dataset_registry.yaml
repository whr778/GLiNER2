  replay_pile30:
    name: Pile-NER-definition 30% replay slice
    tasks: NER (replay)
    license: see card
    source_url: https://huggingface.co/datasets/Universal-NER/Pile-NER-definition
    hf_jsonl: whr778/replay_pile30
    language: [en]
    description: "9,361-record seed-42 slice of pile_ner_def train, sized to be exactly 30% of a DocEE mixture. Guards against the catastrophic forgetting measured on zero-replay arms (-23% to -39% general-domain entity F1, label-space collapse per FairEval). SHARED across all DocEE arms so they differ only in starting checkpoint. Verified 0 overlap with pile_ner_def val, knowledgator_gliner val, docee val/test. NOTE: since pile_ner_def val is half the preservation eval, a good score there after training on this means the replay worked, not that capability survived unaided -- score knowledgator_gliner val separately as the out-of-replay-distribution half."
  replay_137k30:
    name: joint_ie 137k pool, 30% exact replay slice
    tasks: mixed (replay)
    license: mixed -- inherits the 13 source corpora of the 137k pool
    source_url: derived from data/*.train.jsonl of joint-boundary-mmbert-137k.yaml
    hf_jsonl: whr778/replay_137k30
    language: [en, zh]
    description: "9,151-record proportional slice of the 137k joint_ie training pool (seed 42, tools/train/build_137k_replay.py), sized to be exactly 30% of a real+synthetic warm-start mixture. UNLIKE replay_pile30 this is LITERAL replay: we own the 137k base and its pool, so the slice is drawn from exactly what that base trained on, making 'did the original capability survive' directly measurable against the same eval the base was scored on. Proportional across all 13 pool corpora rather than a flat draw, so the composition stays exact at small slice sizes. TRAIN splits only -- the base never saw val or test. Verified 0 overlap with all 23 val/test files of the 137k config and both preservation eval sets."
  professorbob_re:
    name: professorbob_re
    tasks: Relation extraction
    # The upstream Hub card declares NO license (queried 2026-08-30: license, language and
    # tags are all null). Recorded as "see card", the same convention the other unlicensed
    # entries use, so classify_license returns `unverified` and the model card reports
    # commercial use as UNVERIFIED rather than claiming permission. Per this file's own
    # rules: never upgrade an unverified license to a named SPDX id.
    license: see card
    hf_id: ProfessorBob/relation_extraction
    hf_jsonl: whr778/gliner2-corpora-archive
    source_url: https://huggingface.co/datasets/ProfessorBob/relation_extraction
    language: [en]
    description: "Single-triplet relation examples over Wikidata-style properties, regrouped BY PASSAGE by convert_professorbob_re.py so each record carries all of a passage's validated relations rather than repeating the text once per triplet. A triplet is kept only when both surfaces occur verbatim in the whitespace-normalized passage -- a span the model cannot point at is not trainable. Source ships a single train split; SplitWriter carves train/val/test."
  gate2_tr:
    hf_jsonl: whr778/gate2_tr
    name: gate2_tr (multilingual stage-0 gate corpus)
    tasks: Classification (relevance, toll_kind)
    license: mixed -- inherits docee, cc_news, duee and the Turkish news source
    source_url: built by tools/data/build_gate_corpus.py from adjudicated news
    language: [en, tr, zh]
    description: "19,156 rows (9,578 pos / 9,578 neg) for the stage-0 relevance gate: docee 12,228 + Turkish news 4,220 (22%) + cc_news 2,106 + duee 602. Turkish labels are Haiku 4.5 adjudications of REAL articles, not synthetic text -- the earlier multilingual attempt scored F1 1.0000 in-distribution and admitted 0 of 71 real articles because its positives were 99.9% synthetic while its negatives were all real, so the model learned register rather than toll. P(positive|language) is balanced across en/tr/zh (0.499/0.501/0.505) so language cannot proxy for the label. SUPERSEDED for Chinese: this corpus's only Chinese signal is duee (602 rows, 3.1% of the total, a heuristic toll/no-toll label from event-role arguments, not adjudicated) -- fine for v2 (4.1% share) but proportionally diluted once Turkish was added. Measured 2026-09-04: real Chinese admission fell 97% (v2) -> 83% (this corpus). See gate3."
  gate3:
    hf_jsonl: whr778/gate3
    name: gate3 (three-way, en/tr/zh, stage-0 gate corpus)
    tasks: Classification (relevance, toll_kind)
    license: mixed -- inherits docee, cc_news, the Turkish news source and the Chinese gate sample
    source_url: built by tools/data/build_gate_corpus.py --annotated data/gate_ann.jsonl data/turkish_gate/gate_ann_turkish.jsonl data/chinese_gate/gate_ann_chinese.jsonl
    language: [en, tr, zh]
    description: "22,164 rows (11,082 pos / 11,082 neg): docee 12,410 + cc_news 2,106 (en, 65.5%), turkish_news 4,278 (19.3%), zh_news 3,370 (15.2%, from chinese_gate/zh_gate_sample.jsonl -- 4,994 rows adjudicated by the SAME tools/data/annotate_gate.py four-way schema as Turkish, paid for in an earlier phase and unused until this build). Its source field was 1,909 distinct per-outlet names; build_gate_corpus.balance() equalises classes WITHIN each (source, length-decile) cell, so fed in as-is nearly every row would land in a singleton cell and be silently dropped. Normalized to one value, zh_news, via tools/data/normalize_gate_source.py, mirroring turkish_news's own single-source convention. duee (gate2_tr's Chinese source) was dropped ENTIRELY by balance() this build -- global length-decile edges shifted once three languages' length distributions mixed, leaving duee's cells without same-decile counterparts; zh_news's adjudicated labels are a quality improvement over duee's heuristic ones, not a downgrade. tools/data/check_gate_corpus.py PASS: no surface shortcut above 60%, provenance balanced 0%/0%. Verified 0 duplicates, 0 cross-split overlap. Built to close a real, measured Chinese admission regression in gate2_tr (97% -> 83%) without reopening the Turkish gap gate2_tr closed."
  tr_dose0:
    hf_jsonl: whr778/tr_dose0
    name: tr_dose0 (Turkish dose curve, control)
    tasks: Structure extraction (casualty records)
    license: mixed -- inherits casualty_docee and the 137k replay pool
    source_url: built by tools/train/build_turkish_dose_mix.py
    language: [en, zh]
    description: "CONTROL arm of the Turkish dose curve: 12,691 English casualty rows + 30% exact replay from the base's own 137k pool, and ZERO Turkish. Not optional -- every dose arm adds replay AND Turkish at once, so without this arm an improvement over the shipped extractor cannot be attributed to either."
  tr_dose5000:
    hf_jsonl: whr778/tr_dose5000
    name: tr_dose5000 (Turkish dose curve, 5k)
    tasks: Structure extraction (casualty records)
    license: mixed -- inherits casualty_docee, the 137k replay pool and the Turkish news source
    source_url: built by tools/train/build_turkish_dose_mix.py
    language: [en, tr, zh]
    description: "Dose arm: the control mixture plus 5,000 Turkish field-level casualty records annotated by tools/data/annotate_casualty.py. Values are verbatim spans (the boundary head locates fields as spans) and counts are bare numerals keeping Turkish scale words, e.g. '29 bin 313'."
  tr_dose15000:
    hf_jsonl: whr778/tr_dose15000
    name: tr_dose15000 (Turkish dose curve, 15k)
    tasks: Structure extraction (casualty records)
    license: mixed -- inherits casualty_docee, the 137k replay pool and the Turkish news source
    source_url: built by tools/train/build_turkish_dose_mix.py
    language: [en, tr, zh]
    description: "Dose arm: the control mixture plus 15,000 Turkish field-level casualty records. See tr_dose5000 for the annotation contract."
  tr_dose31263:
    hf_jsonl: whr778/tr_dose31263
    name: tr_dose31263 (Turkish dose curve, full)
    tasks: Structure extraction (casualty records)
    license: mixed -- inherits casualty_docee, the 137k replay pool and the Turkish news source
    source_url: built by tools/train/build_turkish_dose_mix.py
    language: [en, tr, zh]
    description: "Largest dose arm: the control mixture plus 29,700 Turkish field-level casualty records (of 31,263 annotated; 5% held out for val/test). At this dose Turkish is 70% of the casualty task against 12,691 English rows, which is what the curve exists to measure. See tr_dose5000 for the annotation contract."
  loc_control:
    hf_jsonl: whr778/loc_control
    name: loc_control (location-supervision control)
    tasks: Structure extraction (casualty records)
    license: mixed -- inherits casualty_natural and the 137k replay pool
    source_url: built by tools/train/build_loc_control.py
    language: [en, zh]
    description: "The SAME 13,080 documents as tr_dose0 with the SAME 30% exact replay, relabelled from casualty_natural (93.0% location coverage) instead of casualty_docee (0%). Isolates location supervision as the single variable behind the dose curve's failure to bind English locations on Helene -- 1 of 96 dead observations against the shipped extractor's 24 of 69, which was misread first as Turkish diluting English and then as an architecture regression. Its val/test carry replay tasks, so unlike the dose curve this run can observe forgetting rather than reporting structures alone."
  casualty_full_ml:
    name: casualty_full_ml (full multilingual casualty retrain)
    tasks: Structure extraction (casualty records)
    license: mixed -- inherits casualty_natural, the Turkish news source and the 137k replay pool
    source_url: built from casualty_natural + data/turkish_gate/cas_ann_tr
    language: [en, tr, zh]
    description: "Unsampled English + Turkish casualty at near-parity: casualty_natural (29,324 docs, 72,733 records, location 93.5%) and cas_ann_tr (31,263 docs, 40,109 records, location 90.9%), English 48.4% of casualty documents against Turkish 51.6%. Deliberately EXCLUDES casualty_docee, casualty_loc_split, casualty_multi and casualty_multi_loc: 97.9-100% of their documents are already in casualty_natural at an older annotation generation, so adding them trains contradictory labels on identical text. No Chinese -- 4 of 818,776 casualty_report structures across every corpus on disk are Chinese."
  zh_multitask_noreplay:
    name: zh_multitask_noreplay (Simplified Chinese, all five tasks, no replay)
    tasks: NER, relation extraction, event extraction, classification, structure extraction
    license: mixed -- inherits shaowenchen/news_zh
    source_url: shaowenchen/news_zh, annotated by tools/data/annotate_multitask.py
    hf_jsonl: whr778/zh-multitask-noreplay
    language: [zh]
    description: "zh_multitask with ALL 137k replay removed -- 5,872 Simplified Chinese articles (5,286/296/290), keeping the parent corpus's partition so no split boundary moves. Replay was stripped by matching inputs against the base pool, not by language: the parent mixes 30% replay into train and ~50% into val/test, and a language filter leaves the Chinese replay corpora (duee, docfee, chfinann, cmnee) behind. The surviving count matches the documented 5,872 annotated articles exactly. Built for a smoke test measuring what the model learns on this task, NOT for preserving the base's zero-shot labels, so nothing is mixed in and val/test are Chinese only. Verified 0 duplicates within each split and 0 intersection across train/val/test. The 16-label zh_topic MENU was still Chinese after the earlier key translation and is now English, matching annotate_multitask.py's TOPIC_LABELS; spans stay Chinese. Label vocabulary is OPEN, not a taxonomy: 70.4% of labels are used twice or fewer because the annotator invented labels per document, so read micro F1 and treat per-label tail scores as noise."
  zh_multitask:
    name: zh_multitask (Simplified Chinese, all five tasks)
    tasks: NER, relation extraction, event extraction, classification, structure extraction
    license: mixed -- inherits shaowenchen/news_zh and the 137k replay pool
    source_url: shaowenchen/news_zh, annotated by tools/data/annotate_multitask.py
    hf_jsonl: whr778/zh-multitask
    language: [zh, en]
    description: "5,872 Simplified Chinese news articles annotated for entities, relations, events, classification (zh_topic, 16 labels) and structures in ONE pass per document -- the article is read once rather than five times, which is why 6,000 documents cost $30.22 rather than $48.34 on Haiku batch. 97.8% of spans verbatim; non-verbatim ones are dropped, not repaired, because the boundary head locates fields as spans and a paraphrase trains nothing while reporting no error. Deliberately NOT cue-filtered: a corpus selected on casualty words would teach that entities and relations occur only in disaster reporting. Disjoint from all 58,556 casualty-annotated documents. Sampled with a stride across news_zh, which is ordered by source in blocks, so a contiguous read would be single-publisher; 3,218 distinct sources. Mixed with 30% exact replay from the 137k pool, and the val/test splits carry replay too so preservation is measurable rather than assumed."
  turkish_pool_general:
    name: turkish_pool_general (uncued Turkish news, for EVENT-TYPE annotation)
    tasks: raw candidate pool -- not trainable as-is
    license: inherits umutertugrul/turkish-news-1.8M-tokenized; publisher copyright, TEXT NOT REDISTRIBUTABLE
    source_url: built by tools/data/build_turkish_pool.py --cue exclude
    hf_jsonl: whr778/turkish-pool-general
    language: [tr]
    description: "253,713 Turkish news documents carrying NO casualty cue, plus a 56,033-document held-out-outlet split (dw.com 20,270, t24.com.tr 35,763). Built because the existing pool CANNOT serve event-type annotation: turkish_pool18 is 100% cue-bearing by construction (20,000/20,000 sampled), since build_turkish_pool.py imported CUE from build_turkish_candidates and filtered on it for CASUALTY annotation. Buying 59-way DocEE event-type labels from that pool would have produced a Turkish arm with zero `sport competition`, `Organization Fine` or `Government Job change` examples -- the model would learn the ~20 disaster types and never learn to say `not a disaster`, which is the worst possible skew for a stage-1 gate whose job includes REJECTING non-disasters. This is the exact COMPLEMENT (verified 0.00% cue-bearing), so a stratified buy of 15K cued + 15K uncued is disjoint by construction. Collected across all 8 outlet-spanning shards, NOT one: an earlier --limit 40000 run was satisfied by shard 0 alone and covered only 3 outlets, and single-publisher register is the confound that invalidated the v1 gate corpus. Final spread: haberler.com 74,133, cnnturk.com 65,412, tr.euronews.com 39,799, aa.com.tr 37,922, yesilgazete.org 13,939, sozcu.com.tr 12,489, indyturk.com 8,322, aljazeera.com.tr 1,696. Natural uncued rate is 53.3% of scanned. 387 already-owned documents excluded by group key so nothing held out or already bought is re-collected."
  turkish_event_type_pilots:
    name: turkish_event_type_pilots (Turkish DocEE event-type adjudication, 2 pilots)
    tasks: classification (docee_event, 59 labels + none)
    license: inherits umutertugrul/turkish-news-1.8M-tokenized; publisher copyright, TEXT NOT REDISTRIBUTABLE
    source_url: tools/data/annotate_event_type.py, Haiku 4.5 batch
    hf_jsonl: whr778/turkish-event-type-pilots
    language: [tr]
    description: "1,055 adjudicated rows (480 + 575) validating the Turkish event-type buy BEFORE the ~$27/30K commitment. Turkish text, ENGLISH DocEE labels -- the same shape DocEE-zh ships -- so all three languages land in one label space with no translation step. Labels verified an EXACT 59/59 match to data/docee.train.jsonl, typos included (Military Excercise, Join in an Orgnization): the base's spelling is canonical. Non-matching labels are DROPPED, never repaired (20 + 25 unusable). Pilot 1 (msgbatch_01EKrMUrHRJnZqtZE1jSrzK9) was a 50/50 cued/uncued split and PROVED the stratification -- 29.0% casualty types cued vs 4.5% uncued -- then exposed that build_turkish_candidates.CUE matches DEATH (oldu/yarali/olum), not DISASTER, so it returned six Earthquakes in 238 docs while Armed Conflict and Famous Person - Death dominated. Pilot 2 added a DISASTER-noun arm; that cue is a good selector (core-disaster yield 10.8% tr_disaster vs 1.4% tr_casualty vs 0.3% tr_general, 7.7x) but does NOT close the gap: projected to 30K it gives ~199 Earthquakes against DocEE-zh's 849 free. The binding constraint is the POOL, not the cue -- Turkish news simply carries few disaster-event articles, and Tsunamis/Volcano Eruption are absent for GEOGRAPHIC reasons rather than sampling ones. Read the Turkish arm as language grounding (Armed Conflict ~1,223, Disease Outbreaks ~768, Road Crash ~569, Floods ~398, Fire ~370 at 30K) with rare-for-Turkey types supplied by en/zh through the shared multilingual space. `none` rate 14.8% then 16.7%: DocEE's taxonomy genuinely misses ~1 in 6 Turkish news stories. Pilot 1's stratum field was normalized post hoc into pilot 2's three-way vocabulary by re-applying the two regexes to its stored text -- labels untouched, and it matters because a fragmented stratum vocabulary is the same defect that would have silently dropped nearly every Chinese row from the gate3 build. Both pilots are disjoint by construction (pilot 2 ran with --exclude), so THE FULL BUY MUST EXCLUDE BOTH or it re-pays for 1,055 documents."
  docee_zh:
    name: docee_zh (DocEE Chinese, unified into DocEE-en's label space)
    tasks: classification (docee_event, 58 types) + entities (4 roles)
    license: DocEE (Tong et al., NAACL 2022); source text third-party copyright
    source_url: data/DocEE/DocEE-zh, via tools/data/prepare_docee_zh.py then convert_docee.py --keep-classification-only
    hf_jsonl: whr778/docee-zh
    language: [zh]
    description: "33,910 records (27,122/3,390/3,398, 80/10/10), 100% Simplified Chinese text with ENGLISH DocEE labels -- the same shape the corpus already ships, so en and zh land in ONE label space with no translation step. 226 MB sat unconverted because convert_docee.py has no Chinese path: records are wrapped one-per-list so the 4-element check returns None for every one, and the key is `event_argument` SINGULAR against ANNOTATIONS_KEYS' plural, so even unwrapped the arguments come back empty and it would convert to classification-only WITHOUT ERROR. EVENT TYPES: 32 of 58 matched en exactly; 26 did not, covering 19,773 records = 54% of the corpus, so more than half would have trained against strings the model is never shown at inference. Map is verified all-targets-canonical and CLOSED (no target is itself a key); en's spelling wins even where en is wrong (Military Excercise, Join in an Orgnization). Fixes include upstream misspellings (Earthqueakes, Volcano Eruptio, Famous Person - Sicks), case (air crash, Gas explosion) and 12 genuine renamings where zh uses a deeper hierarchy (Government Job change - Election -> Election). ARGUMENT ROLES: 344 distinct, ALL CJK, 216,496 instances, disjoint from en's 356 latin ones -- an English event-type MENU above Chinese role ANSWERS, exactly the trap the label rule names. Only the 4 stage-1 roles are mapped, each verified by READING SURFACES: 人员伤亡 ('造成2人死亡、1人受伤') -> Casualties and Losses, 地点 -> Location, 日期 -> Date, 起因于 -> Cause. The other 340 (174,187 instances) are DROPPED, not passed through under Chinese names; --roles all keeps them for the full unification job. Verified CLEAN: 0 cross-split overlap, 0 internal duplicates after dedupe_splits (upstream carried 2,819)."
