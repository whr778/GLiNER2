# ACE 2005 (LDC2006T06, EN + AR + ZH) warm-start schedule A/B -- TREATMENT arm.
#
# Paired against `ace2005/ace2005-eb23a.yaml` (control). Differs ONLY on the
# warm-start schedule axis (plus output_dir / experiment_name):
#   - `soft_iou_anneal_steps: 0` (eb23a's 20,000-step anneal left soft-IoU at ~0.98
#     through the end of a ~500-step fine-tune, rewarding partial overlaps over exact spans)
#   - `consistency_warmup_steps: 0` (eb23a's 2,000-step warmup held consistency < 0.25)
#   - `max_negative_queries_per_batch: 128` (avoid dropping injected event/role negatives)
#   - `gold_injection_end: 0.0`, `gold_injection_hold_frac: 0.10` (finish under real
#     inference injection=0.0 instead of 0.25)
#   - `gradient_accumulation_steps: 2`, `num_epochs: 8` (effective batch 8, ~2.7x
#     optimizer updates on ~1,300 docs)
#
# Single-run noise floor: ±0.02 strict micro-F1 (±0.041 on relations).
model:
  pretrained: whr778/gliner2-eb23a
  architecture: boundary
  boundary_head:
    relation_keep_gold_pairs: true
    relation_argument_proposal_threshold: 0.05
    relation_loss_weight: 2.0
    record_coref_link_weight: 0.0
    record_argument_coref_copy: none
    record_argument_coref_boost: 0.0
    soft_iou_anneal_steps: 0
    consistency_warmup_steps: 0
    max_negative_queries_per_batch: 128
    report_task_losses: true

training:
  checkpoint_restart: null
  output_dir: ./out/ace2005-eb23a-schedule
  experiment_name: ace2005_eb23a_schedule
  data_parallel: false
  num_epochs: 8
  batch_size: 4
  gradient_accumulation_steps: 2
  encoder_lr: 2.0e-5
  task_lr: 2.0e-4
  encoder_lr_backbone_only: true
  warmup_ratio: 0.10
  scheduler_type: cosine
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  gold_injection_start: 0.75
  gold_injection_end: 0.0
  gold_injection_hold_frac: 0.10
  eval_strategy: epoch
  metric_for_best: eval_overall_strict_head_macro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  save_epoch_checkpoint: true
  logging_steps: 10
  num_workers: 2
  validate_data: false
  allow_invalid_samples: true
  ignore_missing_entities: true
  suppress_orphaned_queries: true
  error_policy: skip
  on_capacity_exceeded: truncate_with_warning
  relation_gold_pairs: nearest
  negative_pools: auto
  negative_labels_per_dim:
    entities: 4
    events: 6
  negative_label_seed: 42
  negative_gold_full_roles: true
  expand_argument_coref: false
  schema_dropout: false
  sliding_window: true
  max_len: 4096
  window_stride: 3072
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  seed: 42
  default_schema_mode: dataset

eval:
  batch_size: 2
  threshold: 0.3
  threshold_sweep: true
  calibration_menu: model_schema
  global_decode: true
  eval_by_language: true
  metric_sweep: true
  model_schema: true

labels_file: labels/unified-full-v4.yaml

data:
  # Office ACE keeps offsets in entity_facts, relation_facts, event_facts, and
  # clusters. Load those into the GLiNER2 record. A file already in this repo's
  # shape is left as it is.
  office_ace: true
  corpora:
    - data/ace2005_eng
    - data/ace2005_ara
    - data/ace2005_zho
  event_files: {}
