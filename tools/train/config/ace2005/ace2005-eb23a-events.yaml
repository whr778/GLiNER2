# ACE 2005 (LDC2006T06, EN + AR + ZH) event-focused loss & selection A/B -- TREATMENT arm.
#
# Paired against `ace2005/ace2005-eb23a.yaml` (control). Differs ONLY on the
# event loss-balance & checkpoint-selection axis (plus output_dir / experiment_name):
#   - `relation_loss_weight: 0.5` (down from 2.0, which compounded with
#     `relation_keep_gold_pairs: true` to over-weight relations relative to events)
#   - `task_loss_weights: {events: 2.0}` with `task_loss_weight_scope: all`
#     (reaches start/end/pair/inside/soft_iou/rerank/proposal/abstention/count)
#   - `metric_for_best: eval_event_argument_strict_micro_f1` (instead of 5-head
#     macro where `event_argument` carries only 20% weight)
#
# Single-run noise floor: ±0.02 strict micro-F1 (±0.041 on relations).
model:
  pretrained: whr778/gliner2-eb23a
  architecture: boundary
  boundary_head:
    relation_keep_gold_pairs: true
    relation_argument_proposal_threshold: 0.05
    relation_loss_weight: 0.5
    record_coref_link_weight: 0.0
    record_argument_coref_copy: none
    record_argument_coref_boost: 0.0
    task_loss_weights:
      events: 2.0
    task_loss_weight_scope: all
    report_task_losses: true

training:
  checkpoint_restart: null
  output_dir: ./out/ace2005-eb23a-events
  experiment_name: ace2005_eb23a_events
  data_parallel: false
  num_epochs: 6
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-5
  task_lr: 2.0e-4
  encoder_lr_backbone_only: true
  warmup_ratio: 0.10
  scheduler_type: cosine
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  gold_injection_start: 0.75
  gold_injection_end: 0.25
  eval_strategy: epoch
  metric_for_best: eval_event_argument_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  save_epoch_checkpoint: true
  logging_steps: 10
  num_workers: 2
  validate_data: false
  allow_invalid_samples: true
  ignore_missing_entities: true
  suppress_orphaned_queries: true
  error_policy: skip
  on_capacity_exceeded: truncate_with_warning
  relation_gold_pairs: nearest
  negative_pools: auto
  negative_labels_per_dim:
    entities: 7
    events: 33
  negative_label_seed: 42
  negative_gold_full_roles: true
  expand_argument_coref: false
  schema_dropout: false
  sliding_window: true
  max_len: 4096
  window_stride: 3072
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  seed: 42
  default_schema_mode: dataset

eval:
  batch_size: 2
  threshold: 0.3
  threshold_sweep: true
  calibration_menu: model_schema
  global_decode: true
  eval_by_language: true
  metric_sweep: true
  model_schema: true

labels_file: labels/unified-full-v4.yaml

data:
  # Office ACE keeps offsets in entity_facts, relation_facts, event_facts, and
  # clusters. Load those into the GLiNER2 record. A file already in this repo's
  # shape is left as it is.
  office_ace: true
  corpora:
    - data/ace2005_eng
    - data/ace2005_ara
    - data/ace2005_zho
  event_files: {}
