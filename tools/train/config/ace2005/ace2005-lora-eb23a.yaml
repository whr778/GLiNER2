# ACE 2005 (LDC2006T06, EN + AR + ZH) joint NER + relations + events + coref LoRA on frozen eb23a.
#
# ACE 2005 was held out of eb23a completely (0 training/val/test overlap).
# Convert all three languages at work from your licensed LDC copy before launching
# (or set ACE2005_ROOT=/path/to/ace_2005_td_v7/data in tools/data/run_all_converters.sh):
#
#   for pair in English:eng Arabic:ara Chinese:zho; do
#     uv run python tools/data/convert_ace2005.py \
#       --input "/path/to/ace_2005_td_v7/data/${pair%%:*}" \
#       --out "data/ace2005_${pair##*:}.jsonl" --offsets
#     uv run python tools/data/dedupe_splits.py "data/ace2005_${pair##*:}"
#   done
#   uv run python tools/data/check_leakage.py --config tools/train/config/ace2005/ace2005-lora-eb23a.yaml
#
# Score the zero-shot eb23a control arm on the identical splits BEFORE comparing:
#
#   uv run python tools/train/eval.py \
#     --checkpoint whr778/gliner2-eb23a \
#     --config tools/train/config/ace2005/ace2005-lora-eb23a.yaml \
#     --split val --model-schema
#
# Root-cause fixes vs v1 office run (traced 2026-11-18):
#   1. Split LoRA LRs: encoder.* LoRA runs at encoder_lr (1.0e-4), task-head LoRA at
#      task_lr (3.0e-4) with cosine decay + 10% warmup, avoiding the 5e-4 encoder collapse.
#   2. Unseen ACE relation supervision: relation_keep_gold_pairs: true +
#      relation_argument_proposal_threshold: 0.05 + relation_loss_weight: 2.0 +
#      schema_dropout: false (0% of unseen ACE relation pairs passed eb23a's 0.2 gate at step 0).
#   3. Checkpoint & threshold selection: eval_overall_strict_micro_f1 instead of
#      eval_overall_strict_head_min_f1 so an early 0.0000 relation epoch cannot tie-break
#      metric_sweep to threshold=0.1 or freeze best/ at Epoch 1.
#   4. gold_injection_start/end: 0.25 matches where eb23a Epoch 5 finished.
# Note (2026-11-18): rank-16 LoRA failed to adapt eb23a (0 Arabic base docs) to
# unseen Arabic events (Arabic event_argument 0.0000); use ace2005-eb23a.yaml for
# full-rank fine-tuning. Event-safety fixes from ace2005-eb23a.yaml are synced
# below so this config cannot silently run with expand_argument_coref: true.
# Single-run noise floor: ±0.02 strict micro-F1 (±0.041 on relations).
model:
  pretrained: whr778/gliner2-eb23a
  architecture: boundary
  boundary_head:
    relation_keep_gold_pairs: true
    relation_argument_proposal_threshold: 0.05
    relation_loss_weight: 2.0
    record_coref_link_weight: 0.0
    record_argument_coref_copy: none
    record_argument_coref_boost: 0.0
    report_task_losses: true

training:
  checkpoint_restart: null
  output_dir: ./out/ace2005-lora-eb23a
  experiment_name: ace2005_lora_eb23a
  data_parallel: false
  num_epochs: 8
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 1.0e-4
  task_lr: 3.0e-4
  encoder_lr_backbone_only: true
  warmup_ratio: 0.10
  scheduler_type: cosine
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  gold_injection_start: 0.75
  gold_injection_end: 0.25
  eval_strategy: epoch
  metric_for_best: eval_overall_strict_head_macro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  save_epoch_checkpoint: true
  logging_steps: 10
  num_workers: 2
  validate_data: false
  allow_invalid_samples: true
  ignore_missing_entities: true
  suppress_orphaned_queries: true
  error_policy: skip
  on_capacity_exceeded: truncate_with_warning
  relation_gold_pairs: nearest
  negative_pools: auto
  negative_labels_per_dim:
    entities: 4
    events: 6
  negative_label_seed: 42
  negative_gold_full_roles: true
  expand_argument_coref: false
  schema_dropout: false
  sliding_window: true
  max_len: 4096
  window_stride: 3072
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  seed: 42
  use_lora: true
  lora_r: 16
  lora_alpha: 32.0
  lora_dropout: 0.0
  lora_target_modules:
    - encoder
    - boundary_head
    - record_decoder
    - relation_scorer
    - mention_link
  save_adapter_only: true
  default_schema_mode: dataset

eval:
  batch_size: 2
  threshold: 0.3
  threshold_sweep: true
  calibration_menu: model_schema
  global_decode: true
  eval_by_language: true
  metric_sweep: true
  model_schema: true

labels_file: labels/unified-full-v4.yaml

data:
  # Office ACE keeps offsets in entity_facts, relation_facts, event_facts, and
  # clusters. Load those into the GLiNER2 record. A file already in this repo's
  # shape is left as it is.
  office_ace: true
  # Comment out ace2005_ara / ace2005_zho for an English-only run; eval_by_language
  # reports per-language (en / ar / zh) breakdowns automatically when all three are present.
  corpora:
    - data/ace2005_eng
    - data/ace2005_ara
    - data/ace2005_zho
  event_files: {}
