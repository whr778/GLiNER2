# Stage-0 relevance gate, warm-started from eb22g.
#
# Built against eb22g's splits so 0 base-trained documents enter val/test and 0
# base val/test documents enter train:
#
#   uv run python tools/data/build_gate_corpus.py \
#     --annotated data/gate_ann.jsonl data/turkish_gate/gate_ann_turkish.jsonl data/chinese_gate/gate_ann_chinese.jsonl \
#     --base-config tools/train/config/base/eb22g.yaml \
#     --out-prefix data/gate3_eb22g
#   uv run python tools/train/build_137k_replay.py \
#     --config tools/train/config/base/eb22g.yaml \
#     --new-records 20556 \
#     --replay-frac 0.30 \
#     --exclude-corpora data/gate3_eb22g \
#     --out data/replay_eb22g_gate4
#
# Split sizes: gate3_eb22g 20,556 / 811 / 797 + replay_eb22g_gate4 8,809 (30.0%).
# Val and test contain only base-unseen rows; preservation on eb22g's val is a
# separate companion eval (0 train overlap with eb22g val/test).
model:
  pretrained: whr778/gliner2-eb22g
  architecture: boundary

training:
  checkpoint_restart: null
  output_dir: ./out/gate4-eb22g
  experiment_name: gate4_eb22g
  data_parallel: false
  num_epochs: 4
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_classification_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 2
  validate_data: false
  sliding_window: false
  max_len: 2048
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  seed: 42
eval:
  metric_sweep: true
labels_file: labels/unified-full-v4.yaml

data:
  corpora:
    - data/gate3_eb22g
    - data/replay_eb22g_gate4
  event_files: {}
