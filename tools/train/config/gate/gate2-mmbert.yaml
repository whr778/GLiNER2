# Multilingual 2-label relevance gate, boundary/mmBERT.
#
# Why this exists: off-the-shelf boundary models fail the gate ZERO-SHOT (FP 0.290 on
# related=0 vs the span casualty-docee's 0.002) but learn in-mix label sets very well
# (chfinann 5-label 100%, docfee 9-label 97.5%). So the gate is trained EXPLICITLY.
#
# Corpus: tools/data/build_gate_corpus.py, rebuilt from REAL text in 6d02e43. Both
# classes come from the same Haiku-adjudicated pool (docee 11,879 + cc_news 5,751),
# plus duee for Chinese. Provenance is shared by construction, because a first version
# had synthetic positives against real negatives and the model learned the template.
# Length matching is also load-bearing: an earlier version drew negatives from Haiti-era
# SMS and a LENGTH-ONLY classifier scored 98.5%. Now length-only scores 52.8%.
#
# LANGUAGE, MEASURED on the shipped corpus (an earlier version of this comment claimed
# "52% CJK", which described the corpus this one replaced):
#
#     English (docee + cc_news)   11,302 rows   95.9%
#     Chinese (duee)                 479 rows    4.1%
#     Turkish                         ~21 rows   0.19%  incidental, in English text
#
# So THIS MODEL IS NOT MULTILINGUAL BEYOND CHINESE, whatever the encoder can do.
# Measured 2026-08-27 on gate_turkish_fp.py --sweep: AUC 0.4733 separating Turkish
# casualty reports from Turkish articles containing no disaster or casualty word --
# below chance, at every threshold. Fixing that needs Turkish TEXT, not another
# objective, another epoch or another threshold.
#
# Success bar: match casualty-docee's false-positive rate on related=0 (1/410 = 0.002)
# on benchmark_gate.py while holding recall near 0.676. The Turkish half of this bar is
# NOT reachable from this corpus.
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary
  max_len: 2048
  attn_implementation: flash_attention_2
  boundary_head:
    enable_relations: false
    enable_records: false
  struct_loss: bce_posweight
  struct_pos_weight: 4.0
  sampling: {}
training:
  output_dir: ./out/gate2-mmbert
  experiment_name: gate2_mmbert_multilingual
  data_parallel: false
  num_epochs: 8
  batch_size: 8
  gradient_accumulation_steps: 2
  encoder_lr: 2.0e-05
  task_lr: 0.0005
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_classification_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  sliding_window: false
  max_len: 2048
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false
  error_policy: skip
  on_capacity_exceeded: skip_sample
eval:
  threshold: 0.5
labels:
  entities:
    rollup: false
    separator: .
    map: {}
  relations:
    rollup: false
    separator: .
    map: {}
  events:
    rollup: false
    separator: .
    map: {}
data:
  corpora:
  - data/gate2
  event_files: {}
