# Fine-tune the pretrained fastino/gliner2-multi-v1 GLiNER2 model on WikiANN /
# PAN-X (unimelb-nlp/wikiann): token-BIO NER over 176 languages, three entity
# types (PER/ORG/LOC -> person/organization/location). The multilingual
# checkpoint continues its entity head via from_pretrained. Contrast the
# mmbert-base variant, which bootstraps fresh heads on a raw encoder.
#
# STREAMED, NOT WRITTEN TO DISK: data.hf_streaming streams the train set lazily
# from HF epoch-by-epoch (never fully resident, no data/*.jsonl). A stream has no
# length, so training is bounded by `max_steps` and eval/save/early-stop run
# step-based (eval_strategy: steps + eval_steps). Val/test are bounded in-memory
# samples capped by label class (eval_min_per_class).
#
# LANGUAGE SELECTION lives in data.hf_streaming.langs: a listed subset (edit it)
# or `all` for the 176 languages. Codes are Wikipedia codes (en, de, sw, yo, ...).
model:
  pretrained: fastino/gliner2-multi-v1

training:
  # Streaming resume replays the stream from the start (global_step still
  # advances toward max_steps) -- approximate mid-run resume.
  checkpoint_restart: last
  output_dir: ./out/fastino/gliner2-multi-v1-wikiann
  experiment_name: gliner2-multi-v1_wikiann
  data_parallel: false
  max_steps: 15000          # REQUIRED for streaming (no dataset length)
  num_epochs: 1             # ignored under streaming (bounded by max_steps)
  batch_size: 16
  gradient_accumulation_steps: 2
  encoder_lr: 1.0e-5        # lower LR than from-scratch: fine-tuning a trained model
  task_lr: 3.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: steps      # streaming: eval/save/early-stop are step-based
  eval_steps: 1000
  metric_for_best: eval_entity_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 20
  num_workers: 0            # keep 0 for streaming
  validate_data: false
  sliding_window: false     # NER sentences are short -> no windowing
  max_len: 256              # mDeBERTa-v3 caps at 512 positions; sentences fit easily
  gradient_checkpointing: false
  pin_memory: false
  early_stopping: false

eval:
  batch_size: 8
  threshold: 0.5
  eval_by_language: true

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  hf_streaming:
    source: wikiann
    # A listed subset (edit), or `langs: all` for all 176 languages.
    langs: [en, de, es, fr, ru, ar, zh, hi, sw, yo]
    eval_min_per_class: 3000   # val/test keep >=3000 samples per entity type (some more)
    shuffle_buffer: 10000
  corpora: []
  event_files: {}
