# Stage-2 casualty extractor, warm-started from eb22g.
#
# Built against eb22g's splits so 0 base-trained documents enter val/test and 0
# base val/test documents enter train:
#
#   uv run python tools/train/build_casualty_multilingual.py \
#     --base-config tools/train/config/base/eb22g.yaml \
#     --out data/casualty_ml_eb22g
#   uv run python tools/train/build_137k_replay.py \
#     --config tools/train/config/base/eb22g.yaml \
#     --new-records 77099 \
#     --replay-frac 0.30 \
#     --exclude-corpora data/casualty_ml_eb22g data/casualty_events \
#     --out data/replay_eb22g_casualty
#
# Split sizes: casualty_ml_eb22g 53,472 / 4,200 / 4,200 (20,624 per language
# EN/TR/ZH, 1,400 per language in val and test, 0 base-seen in val/test, 0
# overlap with eb22g val/test) + casualty_events 23,627 / 2,666 / 2,852 +
# replay_eb22g_casualty 33,045 (30.0% of the 110,144-record train mixture).
#
# Selection metric is structure strict micro-F1 (> 0.6078 pre-registered bar).
# Inference anchor stays dead (74.2% of casualty_ml train; location is the
# fallback when a row reports a place with no count).
model:
  pretrained: whr778/gliner2-eb22g
  architecture: boundary

training:
  checkpoint_restart: null
  output_dir: ./out/casualty-ml-eb22g
  experiment_name: casualty_ml_eb22g
  data_parallel: false
  num_epochs: 4
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_structure_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 50
  num_workers: 2
  validate_data: false
  allow_invalid_samples: true
  sliding_window: true
  max_len: 4096
  window_stride: 3072
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  seed: 42
eval:
  metric_sweep: true
labels_file: labels/unified-full-v4.yaml

data:
  corpora:
    - data/casualty_ml_eb22g
    - data/casualty_events
    - data/replay_eb22g_casualty
  event_files: {}
