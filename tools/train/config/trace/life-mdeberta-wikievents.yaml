# WikiEvents event training on mDeBERTa-v3.
# The encoder position limit is 512, so documents are windowed. The train
# median is 2977 characters. The event head is the eb22d head.
# record_merge_coreferent stays unset, so decode stays off. It does not
# enter the record loss. The args merge was measured negative, and link is
# a calibration after training.
# Train gold is the offset file: a string binds every occurrence of those
# words. After argument-coref expansion the largest role has 284 fillers
# (61 roles exceed 32), so the gold budget is 384. Val and test are the
# string splits. The scorer matches text.
model:
  encoder: microsoft/mdeberta-v3-base
  architecture: boundary
  max_len: 512
  attn_implementation: sdpa
  boundary_head:
    max_gold_per_query: 384
    training_candidate_budget: 384
    candidate_budget: 192
    start_top_k: 128
    end_top_k: 128
    candidate_pool: per_query
    enable_relations: true
    enable_records: true
    event_records: true
    record_role_hard_negatives: 8
    proposal_gold: identity
    record_link_mode: junction
    record_link_column_weight: 0.3
    record_coreferent_ownership: true
    record_coref_link: true
    record_coref_link_weight: 0.3
    record_coref_link_negatives: 4
    relation_biaffine_content: true
    directional_relation_states: true
    enable_span_content: true
    enable_rotary_endpoints: true
    endpoint_difference_features: true
    query_conditioned_inside_weight: true
    boundary_attention_layers: 2
    boundary_attention_window: 128
    boundary_marginal_loss: bce
    boundary_negative_weight: 0.5
    boundary_top_k_alpha: 0.08
    hard_negatives_per_positive: 20
    minimum_hard_negatives: 16
    hard_negative_keep_all_when_absent: true
    negative_query_ratio: 1.0
    relation_pair_cap: 64
    relation_argument_proposal_threshold: 0.2
    entity_coref_link: true
    entity_coref_link_weight: 0.3
    entity_coref_link_negatives: 4
    coref_link_distance: mlp
    coref_link_distance_dim: 64
training:
  negative_pools: auto
  negative_labels_per_dim:
    entities: 20
    events: 20
  negative_label_seed: 42
  # The default drops event types. This corpus is 199 documents.
  schema_dropout: false
  gold_injection_start: 1.0
  gold_injection_end: 0.25
  gold_injection_hold_frac: 0.15
  output_dir: /Volumes/Development/tmp/life-mdeberta-wikievents
  experiment_name: life-mdeberta-wikievents
  data_parallel: false
  num_epochs: 5
  batch_size: 1
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-05
  task_lr: 0.0005
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: false
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_overall_strict_head_min_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 6
  save_epoch_checkpoint: true
  logging_steps: 20
  num_workers: 0
  validate_data: true
  sliding_window: true
  window_stride: 384
  max_len: 512
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false
  error_policy: raise
  # An entity string that is not its own word is dropped. The span is not
  # widened onto the enclosing word. A type whose every surface missed leaves
  # the menu, so it is not trained as absent. A malformed record still raises.
  ignore_missing_entities: true
  suppress_orphaned_queries: true
  on_capacity_exceeded: raise
  negative_gold_full_roles: true
  relation_gold_pairs: nearest
  seed: 42
eval:
  batch_size: 1
  threshold: 0.3
  threshold_sweep: true
  metric_sweep: true
  global_decode: true
labels_file: labels/unified-full-v4.yaml
data:
  corpora:
  - data/wikievents_off
  train_only:
  - wikievents_off
  event_files:
    wikievents:
      val: data/wikievents.dev.jsonl
      test: data/wikievents.test.jsonl
