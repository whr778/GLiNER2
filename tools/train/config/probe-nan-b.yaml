# PROBE B: sdpa + fp32 (isolates dtype)
# Generated by tools/train/make_nan_probe_configs.py -- do not edit by hand.
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary
  max_len: 8192
  boundary_head:
    enable_relations: true
    enable_records: true
  struct_loss: bce_posweight
  struct_pos_weight: 4.0
training:
  output_dir: ./out/probe-nan-b
  experiment_name: probe_nan_b
  data_parallel: false
  num_epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-05
  task_lr: 0.0005
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: false
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: 'no'
  metric_for_best: eval_loss
  greater_is_better: false
  save_best: false
  save_total_limit: 2
  logging_steps: 5
  num_workers: 0
  validate_data: false
  sliding_window: true
  window_stride: 3072
  max_len: 4096
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false
  error_policy: skip
  on_capacity_exceeded: skip_sample
  max_steps: 60
eval:
  batch_size: 2
  threshold: 0.5
  threshold_sweep: true
  eval_by_language: false
labels:
  entities:
    rollup: false
    separator: .
    map: {}
  relations:
    rollup: false
    separator: .
    map: {}
  events:
    rollup: false
    separator: .
    map: {}
data:
  corpora:
  - data/scaling_joint/sentence_rex.j10k
  - data/scaling_joint/bio_ner_relations.j10k
  - data/scaling_joint/biored.j10k
  event_files:
    chfinann:
      train: data/scaling_joint/chfinann.j10k.train.jsonl
      val: data/scaling_joint/chfinann.val.jsonl
    docee:
      train: data/scaling_joint/docee.j10k.train.jsonl
      val: data/scaling_joint/docee.val.jsonl
    docfee:
      train: data/scaling_joint/docfee.j10k.train.jsonl
      val: data/scaling_joint/docfee.val.jsonl
    duee:
      train: data/scaling_joint/duee.j10k.train.jsonl
      val: data/scaling_joint/duee.val.jsonl
    cmnee:
      train: data/scaling_joint/cmnee.j10k.train.jsonl
      val: data/scaling_joint/cmnee.val.jsonl
    text2json:
      train: data/scaling_joint/text2json.j10k.train.jsonl
      val: data/scaling_joint/text2json.val.jsonl
    maven:
      train: data/scaling_joint/maven.j10k.train.jsonl
    events_biotech:
      train: data/scaling_joint/events_biotech.j10k.train.jsonl
      val: data/scaling_joint/events_biotech.val.jsonl
    mendeley_ed:
      train: data/scaling_joint/mendeley_ed.j10k.train.jsonl
      val: data/scaling_joint/mendeley_ed.val.jsonl
    casie:
      train: data/scaling_joint/casie.j10k.train.jsonl
      val: data/scaling_joint/casie.val.jsonl
