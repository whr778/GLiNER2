# joint_ie x head-init scaling -- BOUNDARY cold-start base, 10,000 TOTAL records.
# See tools/events_working_papers/JOINT_IE_SCALING.md (sec 3b design, sec 4 experiment).
#
# NEW output paths/names on purpose: this does NOT overwrite the span-architecture
# scaling-mmbert-*.yaml runs, their ./out/scaling-mmbert-* dirs, or anything already
# pushed to HF. Those were span bases (sec 3c); these are the boundary bases the
# joint_ie decode arms need.
#
# Sizes are TOTAL mix records, and EVERY point carries both event and relation data
# at the pool's own ratio (events 73.02% / relations 26.98%), so the only factor
# varying across the curve is volume -- not whether the relation head was warmed at
# all. Slices built by tools/train/build_joint_scaling_mix.py (seed 42, nested).
#
#   this point: 7,316 event + 2,684 relation records
#
# RAMS / Re-DocRED / WikiEvents excluded from the base mix (they are the downstreams).
# DocRED excluded too: Re-DocRED re-annotates the same documents (leakage).
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary     # NOT span -- no max_width here on purpose: that is a
                             # span_head field, and removing the span width cap is
                             # the point of the boundary head (COUNTING_LAYER).
  max_len: 8192
  # FlashAttention 2 is required for CORRECTNESS here, not just speed. Measured on
  # 1x H100, 60 steps of this exact config: sdpa+bf16 goes non-finite at step 15
  # (start/end/pair/soft_iou/rerank all at once) and runs 2.0 samples/s; FA2+bf16
  # is clean for 60 steps at 22.0 samples/s. mmBERT is ModernBERT and is built
  # around FA2 + unpadding (arXiv 2509.06888 Table 8). Needs the 'kernels' package.
  attn_implementation: flash_attention_2
  boundary_head:
    enable_relations: true   # load-bearing: relations decode as edges in the beam
    enable_records: true     # load-bearing: events decode as trigger + role edges
  # No decode_mode here. decode_mode is an EVAL-time switch selecting the greedy or
  # joint arm over ONE trained model (JOINT_IE_SCALING sec 3c); baking it into a
  # training run would make the two arms different models and void the comparison.
  struct_loss: bce_posweight
  struct_pos_weight: 4.0

training:
  output_dir: ./out/joint-boundary-mmbert-10k
  experiment_name: joint_boundary_mmbert_10k
  data_parallel: false
  num_epochs: 5              # held equal across the curve (only total volume varies)
  batch_size: 4
  # NOTE: tuned for 2-GPU DDP (torchrun --nproc_per_node=2), where batch_size is
  # PER-GPU. Accumulation is halved so the EFFECTIVE batch stays 32, matching the
  # single-GPU recipe the throughput anchor and the rest of the curve use.
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_loss
  greater_is_better: false
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  # Long documents are WINDOWED, not truncated: a 4096-subword window with a 3072
  # stride (25% overlap) so cross-boundary structure is still seen. mmBERT supports
  # 8192; 4096 keeps attention cost sane. window_stride is set explicitly because
  # the default 256 would give 94% overlap at this window size -- ~16x redundant
  # work on long docs. Docs under 4096 subwords yield a single window unchanged.
  sliding_window: true
  window_stride: 3072
  max_len: 4096
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false
  # ~7-13% of records in chfinann/docfee/casie/text2json cannot be mapped to word
  # token boundaries by the boundary preprocessor even though every surface IS
  # present verbatim in the text (verified). That is an alignment limitation, not
  # bad data, and it hits languages without whitespace delimiters hardest. Skip
  # those records (counted, not silent) and skip gold-capacity overflows, rather
  # than aborting a multi-hour run. Recorded in JOINT_IE_SCALING.
  error_policy: skip
  on_capacity_exceeded: skip_sample

eval:
  batch_size: 2
  threshold: 0.5
  threshold_sweep: true
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  # Relation corpora warm the relation head; the event corpora cannot.
  # Every point carries BOTH, at the pool's own 73/27 ratio.
  corpora:
    - data/scaling_joint/sentence_rex.j10k
    - data/scaling_joint/bio_ner_relations.j10k
    - data/scaling_joint/biored.j10k
  event_files:
    chfinann:        {train: data/scaling_joint/chfinann.j10k.train.jsonl, val: data/scaling_joint/chfinann.val.jsonl}
    docee:           {train: data/scaling_joint/docee.j10k.train.jsonl, val: data/scaling_joint/docee.val.jsonl}
    docfee:          {train: data/scaling_joint/docfee.j10k.train.jsonl, val: data/scaling_joint/docfee.val.jsonl}
    duee:            {train: data/scaling_joint/duee.j10k.train.jsonl, val: data/scaling_joint/duee.val.jsonl}
    cmnee:           {train: data/scaling_joint/cmnee.j10k.train.jsonl, val: data/scaling_joint/cmnee.val.jsonl}
    text2json:       {train: data/scaling_joint/text2json.j10k.train.jsonl, val: data/scaling_joint/text2json.val.jsonl}
    maven:           {train: data/scaling_joint/maven.j10k.train.jsonl}
    events_biotech:  {train: data/scaling_joint/events_biotech.j10k.train.jsonl, val: data/scaling_joint/events_biotech.val.jsonl}
    mendeley_ed:     {train: data/scaling_joint/mendeley_ed.j10k.train.jsonl, val: data/scaling_joint/mendeley_ed.val.jsonl}
    casie:           {train: data/scaling_joint/casie.j10k.train.jsonl, val: data/scaling_joint/casie.val.jsonl}
