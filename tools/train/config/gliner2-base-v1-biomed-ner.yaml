# Biomedical NER over the 13 MTL-Bioinformatics-2016 corpora (Crichton et al. 2017),
# converted by tools/data/convert_mtl_bio.py. Warm-start from fastino/gliner2-base-v1
# (DeBERTa-v3) and fine-tune -- NER is exactly what that head was trained for, so the
# warm-start is the strongest practical default. Each corpus carries its own entity
# types, so GLiNER2 trains them jointly with no label conflict (16 types in BioNLP13CG,
# 6 ontology types in CRAFT, single types elsewhere).
#
# Swaps: for fresh heads, replace `pretrained:` with `encoder: microsoft/deberta-v3-base`
# (from_encoder); for the multilingual mmBERT backbone, `encoder: jhu-clsp/mmBERT-base`.
# Run tools/data/run_all_converters.sh (or the 13 convert_mtl_bio.py calls) first so the
# data/*.{train,val,test}.jsonl files exist.
model:
  pretrained: fastino/gliner2-base-v1

training:
  checkpoint_restart: last
  output_dir: ./out/gliner2-base-v1-biomed-ner
  experiment_name: gliner2-base-v1_biomed_ner
  data_parallel: false
  num_epochs: 3              # ~56K train records; warm-start needs few passes
  batch_size: 16
  gradient_accumulation_steps: 2   # effective batch 32
  encoder_lr: 1.0e-5         # lower LR: fine-tuning a trained model
  task_lr: 3.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_entity_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  sliding_window: false      # biomedical NER is sentence-level; sentences fit in max_len
  max_len: 512
  gradient_checkpointing: false
  pin_memory: false
  early_stopping: true
  early_stopping_patience: 3

eval:
  batch_size: 16
  threshold: 0.5
  threshold_sweep: true      # calibrate the decision threshold on val for the blind test
  global_decode: false       # entity NER: no cross-window event assembly
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  corpora:
    - data/anatem
    - data/bc2gm
    - data/bionlp09
    - data/bionlp11epi
    - data/bionlp11id
    - data/bionlp13cg
    - data/bionlp13ge
    - data/bionlp13pc
    - data/craft
    - data/ex_ptm
    - data/jnlpba
    - data/ncbi_disease
    - data/linnaeus
  event_files: {}
