# eb17-best: vanilla mmBERT -> the base everything else warm-starts from.
#
# This is eb16-eventrecords-tr with every measured lesson folded in and NOTHING speculative.
# Each change below names the measurement that forces it; anything still open is listed at the
# bottom as NOT APPLIED rather than guessed at.
#
# ---------------------------------------------------------------------------------------
# CHANGED, each on a measurement
# ---------------------------------------------------------------------------------------
#
# 1. `metric_for_best: eval_loss` -> `eval_entity_strict_micro_f1`, `greater_is_better: true`.
#    THE SINGLE MOST EXPENSIVE DEFECT IN THIS PROGRAMME. Selecting on validation loss ships a
#    different epoch per arm (epoch 2 against epoch 4/5) and VOIDED both the absneg and roles2
#    verdicts. A base selected on loss is selected on an objective no downstream user shares.
#    Entity is chosen because it carries the largest support (78,666) and is the most general
#    head -- see OPEN QUESTION 1 below, which would let this be an aggregate instead.
#
# 2. `eval.threshold: 0.5 -> 0.3`. Measured: at 0.5 this model decodes 8 instances and ZERO
#    arguments, so any F1 selected there is noise. The incumbent's own card says 0.3.
#    `threshold_sweep: true` is kept, so the shipped number is still swept on validation.
#
# 3. `validate_data: false -> true`. The standing split-uniqueness gate. 45 corpora once
#    shipped overlapping train/val/test and it invalidated a whole curve.
#
# 4. LABEL NEGATIVES ADDED. This is the largest single change and it is not a tuning knob:
#    until now NO base this project trained had a single absent query, because the menu was
#    built from the gold. Measured: 0.19% absent queries (2 of 1,079) -- NOT the 0 this
#    line used to claim, which was a hardcoded print in probe_absent_queries.py and not a
#    measurement at all. Corrected 2026-09-22; the substance stands because 0.19% is still
#    nothing to train on, and none of it was INJECTED. So `null_loss` (weight 0.2),
#    `count_loss` (0.2), `negative_query_ratio` (0.5) and `abstention_loss`'s positive class
#    have been supervised on an EMPTY SET in every model this project has ever trained. The
#    decode consequence is measurable: given a schema of only ABSENT event types the incumbent
#    fires on 63 of 100 documents, and its real full-menu `event_type` precision is 0.5521
#    against the 1.0000 the blind test reports.
#
# ---------------------------------------------------------------------------------------
# KEPT, deliberately -- each of these was itself bought with a run
# ---------------------------------------------------------------------------------------
#
#   `event_records: true`   without it an events group NEVER reaches the record head, and the
#                           mention path compiles ONE INSTANCE PER TYPE while 64.2% of gold
#                           instances share their type with another in the same document.
#   `bf16` + `flash_attention_2`   sdpa+bf16 on mmBERT produces a finite forward and a NaN
#                           backward; FA2 via `kernels` fixes it and is 11x faster.
#   `labels_file: labels/unified.yaml`   labels are an INPUT at inference, so one concept must
#                           have one spelling across every corpus. An empty inline `labels:`
#                           block silently OVERRIDES this -- there is none in this file.
#   `max_gold_per_query: 256`, `training_candidate_budget: 384`   raised from the defaults that
#                           made real casie documents raise TargetCapacityError.
#   `max_len: 4096` + `sliding_window` + `window_stride: 3072`   long documents are the point.
#
# ---------------------------------------------------------------------------------------
# NOT APPLIED, and why -- the honest part of this file
# ---------------------------------------------------------------------------------------
#
#   `typed_margin_*`        REFUTED 2026-09-21, and not by tuning. The effect has a closed
#                           form, `p_gold'/p_gold = 1/(1+(e^d-1)*w_S)`, in which the logit sd
#                           does not appear. Measured on held-out val the mass on disallowed
#                           candidates is median 0.00003 / mean 0.00284, i.e. a 0.00%-0.28%
#                           loss effect. The model already ranks type-incompatible fillers
#                           near zero. Leave it off.
#
#   `absent_negatives_in_denominator`   PENDING. absneg2 measured +0.0376 event_argument
#                           against -0.1977 classification and -0.0686 event_type, and
#                           `absneg4-roles` is testing whether scoping the pool to event ROLES
#                           keeps the gain without the cost. DO NOT bake this into a base
#                           before that verdict lands.
#
#   30% exact replay        NOT A BASE SETTING. There is no replay flag; replay is corpus
#                           composition, and a COLD start from vanilla mmBERT has nothing to
#                           replay from. It was measured to IMPROVE the base, and that applies
#                           to every stage warm-started FROM this file. See OPTIONS.
#
#   purchased NER corpora   cmnee_ner (9,281) and duee_ner (11,323) are genuine entity gold on
#                           documents already in the mix, but the gold is NOT EXHAUSTIVE.
#                           Adding it as `entities` supervision would teach the entity head
#                           that every unannotated entity is absent. This is why
#                           merge_entity_types.py writes `entity_types` and never an
#                           `entities` block. Needs a partial-annotation flag first.
#
#   `candidate_pool: shared`   NEVER A/B'd. Its 64 tensors sit at initialisation in every
#                           `per_query` checkpoint and get zero gradient, but "untrained" is a
#                           handicap to report, not evidence either way. It is NOT structural
#                           (340 tensors both ways, measured), so the experiment is available.
#
# with events routed through the RECORD head instead of the mention path.
#
# WHY THIS FILE EXISTS. `eb16-rebuild-tr` sets `enable_records: true` with the comment
# "events decode as trigger + role edges". That comment describes JOINT DECODE-TIME
# behaviour and is misleading about TRAINING: without `event_records`, an events group
# never reaches the record head at all, so eb16's record head was supervised on
# `json_structures` only and has never seen an event. Verified -- `event_records` appears
# zero times in eb16-rebuild-tr.yaml and zero times in every other file under config/base/.
#
# WHAT THAT COSTS, measured on the 18,786-record blind test
# (EVENT_ARGUMENT_DIAGNOSIS.md): `event_argument` reads 0.1178 STRICT against 0.5783
# RELAXED on the same predictions. The only difference between those keys is whether the
# argument must attach to the right TRIGGER. Boundary and label errors together are 6.6% of
# gold, so the model FINDS the arguments and cannot BIND them -- because the mention path
# compiles ONE INSTANCE PER EVENT TYPE and 64.2% of gold event instances share their type
# with another instance in the same document (cmnee 1,606 docs, maven 346, casie 102).
# Two-thirds of gold events are structurally inexpressible by that decoder.
#
# `event_records: true` routes events through the record head, which is multi-instance by
# construction. VERIFIED through `collate_fn_train` -- the TRAINING path, not inference --
# on a real CMNEE document carrying Experiment x2 / Accident x1 / Injure x2:
#
#     event_records=False -> 0 record specs   (events never reach the record head)
#     event_records=True  -> 3 record specs   (one per type, natural mode, 5 fields each)
#
# WHY NOT A TIER 2 FINE-TUNE, WHICH WAS TRIED TWICE AND FAILED. CASIE Tier 2 scored 0.0036
# against a 0.2998 control; MAVEN gave trigger -0.008. Both flipped the decode path on a
# record head with NO event competence, measuring the sum of a path change and a head-init
# failure -- and head-init is the largest effect in this programme (RAMS arguments
# 0.042 -> 0.462, elevenfold). This config makes the change at COLD START, so the head is
# warmed on events from step 0 and that sum never forms.
#
# WHAT IT KEEPS FROM eb16-rebuild-tr, unchanged: the 13-corpus trilingual mix
# (en 43.8% / zh 38.0% / tr 18.2%), the character-class length proxy, `labels/unified.yaml`,
# and every hyperparameter. Those were rebuilt deliberately and are not in question here.
#
# WHAT IT ADDS BEYOND eb16, all three vetted 2026-09-15 with ZERO exact-text overlap
# against the corpora already in the mix:
#
#   professorbob_re  +13,926 relation records, regrouped BY PASSAGE so each record carries
#                    all of a passage's triples -- the dense multi-relation shape the joint
#                    decode exists for, which sentence_rex (one triple per sentence) cannot
#                    supply.
#   scierc           +265. Domain, not volume: the only scientific relation corpus.
#   paraloq_json     +378. The only structure corpus besides text2json, and it is here
#                    BECAUSE of event_records -- moving events onto the record head
#                    increases what that head must do.
#
# DELIBERATELY NOT ADDED, and these refusals are load-bearing:
#
#   rams        NO. The EVENT DOWNSTREAM. It trains joint-boundary-rams-137k, the
#               rams-clean-* arms and PAPER_0's head-init curve. Putting it in a base
#               contaminates all of them INVISIBLY -- the downstream just looks better.
#               Requested 2026-09-15 and refused for this reason.
#   redocred    NO. Relation downstream, same argument.
#   wikievents  NO. Event downstream, same argument.
#   docred      NO. Re-DocRED re-annotates its documents; including it leaks downstream.
#   klue_re     NO for now -- 22,521 Korean records at 17% contamination (TODO). Currently
#               "not in a live config, so not blocking"; adding it would make it blocking.
#   ace2005     NOT AVAILABLE. LDC2006T06, not redistributable, not present in data/.
#
# READ AGAINST: `whr778/gliner2-eb16-rebuild-tr`, which is this data with the mention path.
# PRIMARY: `eval_event_argument_strict_micro_f1` -- eb16's own figure is 0.1178.
# REPORT RELAXED BESIDE STRICT. Strict moving toward relaxed while relaxed HOLDS is the
# binding hypothesis confirmed. Both moving means something else changed, and the run says
# less than it appears to.
#
# NOT A ONE-VARIABLE A/B: this differs from eb16-rebuild-tr by the flag AND by three added
# corpora. A difference is attributable to either. If the clean flag comparison is what is
# wanted, drop the three additions below and the diff becomes one key.
#
# COST: full cold start, ~180k records x 5 epochs at effective batch 16 on ONE GPU. Budget
# ~$25-35 and read the per-GPU batch warning in the training block before using two cards.

# eb16 REBUILT: the length-proxy fix, plus Turkish -- the base becomes trilingual.
#
# TWO REASONS, and only the first is a defect.
#
# 1. THE LENGTH PROXY WAS BROKEN WHEN eb16 TRAINED. `lengths` was len(text.split()),
#    which returns ~1 for Chinese. eb16 is 46.5% Chinese (ChFinAnn 25,632 + DocFEE 16,384
#    + DuEE 11,603 + CMNEE 9,281 = 62,900 of 135,352) -- the MOST affected model in the
#    project -- so nearly half its corpus sorted into one length bucket. Measured on
#    gate3.train, that regime put 39.2% of batches at 100% one language against a 3.7%
#    random floor; the char-class fix brings it to 9.7%. eb16 sits at the ROOT of the
#    lineage (casualty-multilingual warm-starts from it, and stage-1 from that), so the
#    defect propagates downstream.
#
# 2. THE BASE HAD NEVER SEEN TURKISH while its own child had. casualty-multilingual
#    fine-tunes Turkish onto an encoder with zero Turkish grounding. data/turkish_event
#    (30,134 rows, bought 2026-09-04) closes that.
#
# TURKISH WAS VERIFIED COMPATIBLE BEFORE BEING ADDED, not assumed:
#   - its 338 entity roles are a CLEAN SUBSET of DocEE's 356 (0 foreign roles), because
#     the entity menu was conditioned on DocEE's own per-type role sets when bought;
#   - 5 of them are keys in labels/unified.yaml (Start_Date and Start Date both ->
#     StartDate, End_Date and End Date -> EndDate, Areas Affected -> Areas affected), so
#     labels_file is LOAD-BEARING here: without it those train as separate roles. DocEE
#     itself carries the variants; the map exists to collapse them;
#   - its only classification label outside DocEE's 59 is `none` (16.9%), kept because it
#     is a real negative for the classifier.
#
# THE CORPUS LIST IS RESTORED FROM THE MODEL CARD, not from this file's previous contents.
# The config on disk listed 3 corpora while the card records 12 at 135,352 rows -- the
# "a config is not a permanent record of the run" trap. All 12 verified present locally
# with row counts matching the card exactly.
#
# SHARES SHIFT and that is deliberate: en 53.5% -> 43.8%, zh 46.5% -> 38.0%, tr 0 -> 18.2%.
# Adding a language dilutes the others -- that mechanic cost Chinese in gate2_tr and
# English in gate3. For a BASE, broader coverage is the point, but the shares are recorded
# here so the next person does not rediscover them from a regression.
#
# WikiANN was CONSIDERED AND REJECTED for this rebuild. Its 3-class annotation would not
# inject noise -- entity menus are per-record, so unlabeled spans are never scored -- but
# its PER/ORG/LOC would need unifying against a vocabulary that deliberately keeps
# GPE != Location and NORP != Organization, which is judgement work requiring surface
# reading. turkish_event needs no unification beyond the 5 map entries above.
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary     # NOT span -- no max_width here on purpose: that is a
                             # span_head field, and removing the span width cap is
                             # the point of the boundary head (COUNTING_LAYER).
  max_len: 8192
  # FlashAttention 2 is required for CORRECTNESS here, not just speed. Measured on
  # 1x H100, 60 steps of this exact config: sdpa+bf16 goes non-finite at step 15
  # (start/end/pair/soft_iou/rerank all at once) and runs 2.0 samples/s; FA2+bf16
  # is clean for 60 steps at 22.0 samples/s. mmBERT is ModernBERT and is built
  # around FA2 + unpadding (arXiv 2509.06888 Table 8). Needs the 'kernels' package.
  attn_implementation: flash_attention_2
  boundary_head:
    # max_gold_per_query: 32 (the library DEFAULT) drops the WHOLE sample's gold, and this
    # config's `on_capacity_exceeded: skip_sample` is what makes that silent. skip_sample
    # fires when ANY ONE query overflows and clears gold for EVERY query in the document --
    # and an empty mention_mask is not "no supervision", it is POSITIVE supervision to
    # abstain: abstention_loss targets `~mention_mask.any(-1)` (boundary/losses.py:601) and
    # count_log_rate_loss supervises a count of zero. The model is actively taught to emit
    # nothing on the documents carrying the MOST gold. It fired 3,520 times in the
    # eb16-eventrecords-tr run, on overflows of 34-66, and plausibly explains that run's
    # entity regression (strict 0.5340 -> 0.4343).
    #
    # THE BASE CONFIGS WERE THE OUTLIER. Eleven other configs already raise this: the
    # casualty and zh-multitask lines use 256, and tier2/archive/casie-* records why --
    # "a single query carries up to 188 gold spans against the default cap of 32". Those hit
    # it as a loud TargetCapacityError because they kept the default `raise`; these configs
    # set skip_sample, which converted the same overflow into silent damage.
    #
    # Sized from the data AND aligned to that precedent. Across this config's own corpora,
    # of 89,392 (doc, label) query groups: 0.789% exceed 32, 0.037% exceed 128, 0.011%
    # exceed 256. 256 matches the established value so warm-started comparisons stay
    # like-for-like. training_candidate_budget must be >= it; 384 is the casie pair and is
    # sufficient -- the casualty configs' 1024 is far beyond the constraint and costs
    # throughput (6.4x the enumeration of the 160 default) for no additional coverage here.
    # candidate_budget is deliberately LEFT at its 128 default: that is an inference-width
    # decision, and the casualty precedent likewise trains wider than it decodes.
    # Pinned by tests/processing/test_gold_capacity.py.
    max_gold_per_query: 256
    training_candidate_budget: 384
    enable_relations: true   # load-bearing: relations decode as edges in the beam
    enable_records: true     # load-bearing: events decode as trigger + role edges
    # THE CHANGE. Off in eb16-rebuild-tr and in every other config/base/ file, which is why
    # no base model's record head has ever been trained on an event. Lifts the
    # one-instance-per-event-type cap that `compile_record_specs` records as costing 78.8%
    # of gold instances on CASIE, 62.5% on WikiEvents, 38.3% on MAVEN -- and 0.0% on RAMS,
    # which is exactly why the RAMS argument curves could never have surfaced it.
    event_records: true
  # No decode_mode here. decode_mode is an EVAL-time switch selecting the greedy or
  # joint arm over ONE trained model (JOINT_IE_SCALING sec 3c); baking it into a
  # training run would make the two arms different models and void the comparison.
  struct_loss: bce_posweight
  struct_pos_weight: 4.0

training:
  # LABEL NEGATIVES. Until this file, no base this project trained had a SINGLE absent
  # query: the menu was built from the gold, so nearly every query carried gold (measured
  # 2026-09-22 at 0.19%, 2 of 1,079 -- the few absent ones are an ACCIDENT of surfaces that
  # fail to align, not a design; see tools/data/measure_surface_alignment.py
  # in 574). That left `null_loss`, `count_loss`, `negative_query_ratio` and
  # `abstention_loss`'s entire positive class supervised on nothing, in every model ever
  # trained here. This is the cheapest way to turn four dead mechanisms on.
  # `auto` derives the pools from THIS config's corpora. The committed JSON was built
  # from eb16-eventrecords-tr.yaml and has no pool for cmnee_ner, duee_ner or
  # docee_zh, so 47,726 records -- 23.6% of this mix -- received ZERO negatives while
  # `_candidates` returned nothing for them, silently. That is the exact failure the
  # `auto` path exists to prevent, and the header already warned about it.
  negative_pools: auto
  negative_labels_per_dim: {entities: 1, events: 1}
  negative_label_seed: 42
  output_dir: ./out/eb17-best
  experiment_name: eb17_best
  data_parallel: false
  num_epochs: 5              # held equal across the curve (only total volume varies)
  # H100 80GB, not A100 40GB. batch_size DOUBLES and grad-accum HALVES, so the EFFECTIVE
  # batch stays 16 and the recipe is unchanged -- only the number of accumulation steps
  # drops. batch_size is PER-GPU, so this is the one axis where a card swap silently becomes
  # a different experiment if the product is not held fixed.
  batch_size: 8
  # WARNING, measured not assumed: batch_size is PER-GPU, so this file is a DIFFERENT
  # recipe depending on how it is launched, and the note that used to sit here claimed
  # otherwise.
  #
  #   1 GPU : 4 x 4         = effective 16, 42,730 steps  <- what the 137k v1 base and
  #                                                          the rest of the curve ran
  #   2 GPUs: 4 x 4 x 2     = effective 32, 21,365 steps  <- HALF the optimizer updates
  #
  # v1's model card records "4 (x 4 grad-accum)" on one GPU, and 42,730 steps over
  # 135,635 records x 5 epochs is effective 16 exactly. So a 2-GPU launch doubles the
  # batch and halves the updates rather than matching the curve. Set
  # gradient_accumulation_steps: 2 under torchrun --nproc_per_node=2 to reproduce the
  # curve's optimization, or accept an off-curve base and re-baseline everything
  # downstream of it.
  gradient_accumulation_steps: 2      # 8 x 2 = 16, same as eb16's 4 x 4
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  # `num_cycles` is NOT set here and inherits the default, which changed 2026-09-22 from
  # 0.5 to 1.0. At 0.5 this schedule performed NO restarts and ended at 50% of base LR --
  # `cos(pi * ((num_cycles * progress) % 1.0))` never wraps when the argument tops out at
  # 0.5 -- so every model this project trained before that date finished its last epoch
  # taking full-size steps instead of annealing. At 1.0 it is identical to `cosine` at
  # every real step. The trainer now prints the resolved multiplier curve at startup.
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  # head_min_f1, NOT a single head. It is the WORST head's strict micro-F1, so it cannot be
  # improved by trading one head away -- which is the failure this programme keeps hitting:
  # absneg2 bought +0.0376 on event_argument and paid -0.1977 on classification; the gate3
  # warm cells bought +0.024 on target and lost on ALL EIGHT heads. Entity F1 was the previous
  # choice only because no aggregate existed; `eval_overall_*` landed 2026-09-21.
  metric_for_best: eval_overall_strict_head_min_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  # `num_workers: 0` was an MPS constraint carried over from local runs, not a CUDA one.
  # 4 workers: measured 0 -> 12 took 5.0 -> 3.2 s/it on the joint-boundary training path.
  # (The "num_workers refuted" note in the catalog is an INFERENCE measurement -- 18.4 at 0
  # against 18.5 at 4 -- and does not transfer to training.)
  #
  # CONSEQUENCE, AND IT MUST NOT BE MISREAD: `__getitem__` runs in FORKED workers, so the
  # injector's counters live in the child and `composition_line()` reads the PARENT's, which
  # stay at zero. **A `[composition] ... 0/0 records` line under num_workers > 0 is an
  # artefact of forking, NOT evidence that negatives failed.** The guard that still works is
  # `ExtractorTrainer._wired`, which refuses to start when negatives are configured and the
  # dataset carries no injector -- that runs in the parent at dataset construction.
  num_workers: 4
  validate_data: true
  # Long documents are WINDOWED, not truncated: a 4096-subword window with a 3072
  # stride (25% overlap) so cross-boundary structure is still seen. mmBERT supports
  # 8192; 4096 keeps attention cost sane. window_stride is set explicitly because
  # the default 256 would give 94% overlap at this window size -- ~16x redundant
  # work on long docs. Docs under 4096 subwords yield a single window unchanged.
  sliding_window: true
  window_stride: 3072
  max_len: 4096
  gradient_checkpointing: true
  pin_memory: true                    # worth it once num_workers > 0
  early_stopping: false
  # ~7-13% of records in chfinann/docfee/casie/text2json cannot be mapped to word
  # token boundaries by the boundary preprocessor even though every surface IS
  # present verbatim in the text (verified). That is an alignment limitation, not
  # bad data, and it hits languages without whitespace delimiters hardest. Skip
  # those records (counted, not silent) and skip gold-capacity overflows, rather
  # than aborting a multi-hour run. Recorded in JOINT_IE_SCALING.
  error_policy: skip
  on_capacity_exceeded: skip_sample

eval:
  batch_size: 2
  threshold: 0.3
  threshold_sweep: true
  eval_by_language: false

# Unified label space, shared with every model warm-started from this base so they
# all present the same labels. Generated -- see the file header to regenerate.
labels_file: labels/unified.yaml

data:
  # Relation corpora warm the relation head; the event corpora cannot.
  # Every point carries BOTH, at the pool's own 73/27 ratio.
  corpora:
  - data/sentence_rex
  - data/bio_ner_relations
  - data/biored
  - data/chfinann
  - data/docee
  - data/docfee
  - data/duee_ner
  - data/cmnee_ner
  - data/text2json
  - data/maven
  - data/events_biotech
  - data/casie
  - data/turkish_event
  # Added beyond eb16-rebuild-tr -- see the header for the vetting and the refusals.
  - data/professorbob_re
  - data/scierc
  - data/paraloq_json
  # docee_zh: 27,122 Chinese records on the SAME 60-label docee_event menu -- verified
  # identical to docee-en and turkish_event. The menus were unified by
  # unify_docee_menus.py, which rewrote only `labels` and never `true_label`, so no
  # annotation changed and no label was invented. Built, split-clean (0 overlap against
  # every docee/docee_zh val and test split) and on HF since before eb16, and simply never
  # wired in. It is free supervision on the one head that keeps collapsing under
  # interventions that never target it. Its entity contribution is small by design --
  # 31,369 mentions over 4 roles, the other 340 CJK roles were dropped rather than passed
  # through under Chinese names.
  - data/docee_zh

  # TRAIN ONLY. An added corpus silently brings its own TEST split too, and two arms scored
  # on different denominators is not a comparison -- `compare_runs.py` refuses it, and that
  # defect already voided an entity row here. docee_zh's 3,398 test records would move the
  # blind test off 20,602 and break every comparison against eb16 and the absneg arms.
  # cmnee_ner / duee_ner: the SAME documents as cmnee / duee (99.9%% and 97.6%% overlap, same
  # events) plus the purchased entity gold -- cmnee and duee carry ZERO entity mentions, these
  # carry 120,985 and 46,330. TRAIN ONLY, because their val/test splits are near-identical but
  # NOT the same (cmnee.test 2,724 docs / 0 entities against cmnee_ner.test 2,724 / 37,816,
  # overlapping 2,721), so scoring on them would move the blind test AND change entity support.
  # The `event_files` entries below keep val/test on the ORIGINAL cmnee/duee files and have had
  # their `train` key removed, or the entity-less train would come straight back in.
  train_only: [docee_zh, cmnee_ner, duee_ner]

  # cmnee_ner's gold is NOT exhaustive within an offered label -- probed at 4.23 missed per
  # document against 13.0 annotated, i.e. 32.4%. It is declared PARTIAL so it contributes
  # POSITIVES while being refused as a source of NEGATIVES for entities. For scale: docee,
  # already supplying 26.9%% of this mix's entity mentions, probes at 33.0% on the identical
  # probe, and duee_ner at 7.1% -- so this is the incumbent bar, not a new risk.
  partial_annotation:
    cmnee_ner: [entities]

  event_files:
    chfinann:        {train: data/chfinann.train.jsonl, val: data/scaling_joint/chfinann.val.jsonl, test: data/chfinann.test.jsonl}
    docee:           {train: data/docee.train.jsonl, val: data/scaling_joint/docee.val.jsonl, test: data/docee.test.jsonl}
    docfee:          {train: data/docfee.train.jsonl, val: data/scaling_joint/docfee.val.jsonl, test: data/docfee.test.jsonl}
    duee:            {val: data/scaling_joint/duee.val.jsonl}
    cmnee:           {val: data/scaling_joint/cmnee.val.jsonl, test: data/cmnee.test.jsonl}
