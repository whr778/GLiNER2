# EVENT RECORDS ARM. Identical to joint-boundary-mmbert-137k.yaml in every respect but
# ONE KEY: `boundary_head.event_records: true`. Copied by patch rather than rewritten, so
# the mixture, hyperparameters, windowing and label space are byte-identical and the flag
# is the only variable.
#
# WHY. `event_argument` reads 0.1178 strict against 0.5783 RELAXED on the same predictions
# -- the only difference between those keys is whether the argument must attach to the
# right TRIGGER (EVENT_ARGUMENT_DIAGNOSIS.md). Boundary and label errors together are 6.6%
# of gold, so the model FINDS the arguments and cannot BIND them. The mechanical reason is
# that the mention path compiles ONE instance per event type, and 64.2% of gold event
# instances in the blind test share their type with another instance in the same document
# (cmnee 1,606 documents, maven 346, casie 102). Two-thirds of gold events are
# structurally inexpressible by the decoder that produced that 0.1178.
#
# `event_records: true` routes events through the RECORD head, which is multi-instance by
# construction. VERIFIED on a real CMNEE document carrying Experiment x2 / Accident x1 /
# Injure x2, through `collate_fn_train`, not inference:
#
#     event_records=False -> 0 record specs    (events never reach the record head)
#     event_records=True  -> 3 record specs    (one per type, mode=natural, 5 fields each)
#
# THIS HAS NEVER BEEN DONE IN A BASE RUN. `event_records` appears ZERO times in
# joint-boundary-mmbert-137k.yaml and zero times in every other file under config/base/, so
# the record head in every base this project has trained was supervised on
# `json_structures` ONLY. It has never seen an event.
#
# WHY THE TWO ARCHIVED TIER 2 ARMS DO NOT SETTLE THIS. CASIE Tier 2 scored 0.0036 against a
# 0.2998 control and MAVEN gave trigger -0.008 -- but both flipped the decode path on a
# record head with NO event competence, so they measured the sum of a path change and a
# head-init failure. Head-init is the largest effect measured in this programme (RAMS
# arguments 0.042 -> 0.462, elevenfold). This config changes the path AT COLD START, so the
# head is warmed on events from step 0 and the confound does not arise.
#
# THIS IS NO LONGER A CURVE POINT, AND IT IS NO LONGER A ONE-VARIABLE A/B. As first
# written this file differed from joint-boundary-mmbert-137k.yaml by three lines and the
# flag was the only variable. Adding data (below) changes that: a difference against the
# 137k control is now attributable to `event_records` OR to the extra corpora, and nothing
# in the result can separate them.
#
# That is a deliberate trade, not an oversight. The goal here is a BETTER BASE, which is a
# different objective from the clean flag A/B. If the A/B is what is wanted, the honest
# options are (a) revert the data section to the 137k mix and keep the three-line diff, or
# (b) train a matching control with the SAME added data and the flag off, at roughly double
# the cost. Do not read this run against the existing 137k base and call it an event_records
# result.
#
# WHAT WAS DELIBERATELY NOT ADDED, and why -- these are the load-bearing decisions:
#
#   rams        NO. It is the EVENT DOWNSTREAM. The original header excludes it for that
#               reason and the exclusion still binds: RAMS trains joint-boundary-rams-137k,
#               the rams-clean-* arms and PAPER_0's head-init curve (0.042 -> 0.462).
#               Putting it in the base contaminates every one of those measurements, and
#               the contamination would be invisible -- the downstream would simply look
#               better. Requested 2026-09-15 and refused for this reason.
#   redocred    NO. Relation downstream, same argument.
#   wikievents  NO. Event downstream, same argument.
#   docred      NO. Re-DocRED re-annotates the same documents; including it leaks into the
#               Re-DocRED downstream.
#   klue_re     NO, for now. 22,521 Korean RE records, but TODO records it at 17%
#               contamination. It is currently "not in a live config, so not blocking";
#               adding it here would make it blocking. Regenerate first.
#   ace2005     NOT AVAILABLE. LDC2006T06, not redistributable, and not present in data/.
#   docee_zh    HELD. 27,122 records, but it is classification + entities rather than
#               events, and it would shift the language balance materially. A decision
#               about what this base IS, not a free addition.
#   turkish_event  HELD, same reason -- it would make this base trilingual, which is what
#               eb16-rebuild-tr is for.
#
# READ AGAINST: whr778/gliner2-joint-boundary-mmbert-137k, the same recipe with the flag
# off. Primary metric `eval_event_argument_strict_micro_f1` (0.1178 on eb16-rebuild-tr;
# the 137k base's own figure is the correct control and must be read from its own run, not
# borrowed). REPORT RELAXED BESIDE STRICT: if strict moves toward relaxed while relaxed
# holds, that is the binding hypothesis confirmed. If BOTH move, something else changed.
#
# EXPECT THE RECORD LOSS TO DOMINATE DIFFERENTLY. `event_records` mixes events into the
# record loss (probe_task_losses.py says so explicitly), so the loss composition is not
# comparable term-by-term with the control. Use the eval heads, not train loss.
#
# COST: this is a full cold-start base -- 136,787 records x 5 epochs, 42,730 optimizer
# steps at effective batch 16 on ONE GPU. The curve restart that produced these bases cost
# ~$47 for the whole curve; budget ~$20-30 for this single point, and read the per-GPU
# batch warning below before launching on more than one card.

# joint_ie x head-init scaling -- BOUNDARY cold-start base, 136,787 TOTAL records.
# See tools/events_working_papers/JOINT_IE_SCALING.md (sec 3b design, sec 4 experiment).
#
# NEW output paths/names on purpose: this does NOT overwrite the span-architecture
# scaling-mmbert-*.yaml runs, their ./out/scaling-mmbert-* dirs, or anything already
# pushed to HF. Those were span bases (sec 3c); these are the boundary bases the
# joint_ie decode arms need.
#
# Sizes are TOTAL mix records, and EVERY point carries both event and relation data
# at the pool's own ratio (events 73.02% / relations 26.98%), so the only factor
# varying across the curve is volume -- not whether the relation head was warmed at
# all. Slices built by tools/train/build_joint_scaling_mix.py (seed 42, nested).
#
#   this point: 100,080 event + 36,707 relation records
#
# RAMS / Re-DocRED / WikiEvents excluded from the base mix (they are the downstreams).
# DocRED excluded too: Re-DocRED re-annotates the same documents (leakage).
#
# Leakage checked, not assumed: sentence_rex is knowledgator/sentence_rex --
# sentence-level Wikidata-property RE, a different dataset and granularity from
# thunlp/docred. A 3,000-sentence sample had ZERO verbatim occurrences anywhere in
# Re-DocRED's 3.2M chars of train text.
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary     # NOT span -- no max_width here on purpose: that is a
                             # span_head field, and removing the span width cap is
                             # the point of the boundary head (COUNTING_LAYER).
  max_len: 8192
  # FlashAttention 2 is required for CORRECTNESS here, not just speed. Measured on
  # 1x H100, 60 steps of this exact config: sdpa+bf16 goes non-finite at step 15
  # (start/end/pair/soft_iou/rerank all at once) and runs 2.0 samples/s; FA2+bf16
  # is clean for 60 steps at 22.0 samples/s. mmBERT is ModernBERT and is built
  # around FA2 + unpadding (arXiv 2509.06888 Table 8). Needs the 'kernels' package.
  attn_implementation: flash_attention_2
  boundary_head:
    enable_relations: true   # load-bearing: relations decode as edges in the beam
    enable_records: true     # load-bearing: events decode as trigger + role edges
    # THE ONE VARIABLE. Off everywhere else in config/base/, which is why no base model's
    # record head has ever been trained on an event. Lifts the one-instance-per-event-type
    # cap: `compile_record_specs` records that cap costing 78.8% of gold instances on
    # CASIE, 62.5% on WikiEvents, 38.3% on MAVEN -- and 0.0% on RAMS, which is why the
    # RAMS argument curves could never have surfaced it.
    event_records: true
  # No decode_mode here. decode_mode is an EVAL-time switch selecting the greedy or
  # joint arm over ONE trained model (JOINT_IE_SCALING sec 3c); baking it into a
  # training run would make the two arms different models and void the comparison.
  struct_loss: bce_posweight
  struct_pos_weight: 4.0

training:
  output_dir: ./out/joint-boundary-mmbert-137k-eventrecords
  experiment_name: joint_boundary_mmbert_137k_eventrecords
  data_parallel: false
  num_epochs: 5              # held equal across the curve (only total volume varies)
  batch_size: 4
  # WARNING, measured not assumed: batch_size is PER-GPU, so this file is a DIFFERENT
  # recipe depending on how it is launched, and the note that used to sit here claimed
  # otherwise.
  #
  #   1 GPU : 4 x 4         = effective 16, 42,730 steps  <- what the 137k v1 base and
  #                                                          the rest of the curve ran
  #   2 GPUs: 4 x 4 x 2     = effective 32, 21,365 steps  <- HALF the optimizer updates
  #
  # v1's model card records "4 (x 4 grad-accum)" on one GPU, and 42,730 steps over
  # 135,635 records x 5 epochs is effective 16 exactly. So a 2-GPU launch doubles the
  # batch and halves the updates rather than matching the curve. Set
  # gradient_accumulation_steps: 2 under torchrun --nproc_per_node=2 to reproduce the
  # curve's optimization, or accept an off-curve base and re-baseline everything
  # downstream of it.
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_loss
  greater_is_better: false
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  # Long documents are WINDOWED, not truncated: a 4096-subword window with a 3072
  # stride (25% overlap) so cross-boundary structure is still seen. mmBERT supports
  # 8192; 4096 keeps attention cost sane. window_stride is set explicitly because
  # the default 256 would give 94% overlap at this window size -- ~16x redundant
  # work on long docs. Docs under 4096 subwords yield a single window unchanged.
  sliding_window: true
  window_stride: 3072
  max_len: 4096
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false
  # ~7-13% of records in chfinann/docfee/casie/text2json cannot be mapped to word
  # token boundaries by the boundary preprocessor even though every surface IS
  # present verbatim in the text (verified). That is an alignment limitation, not
  # bad data, and it hits languages without whitespace delimiters hardest. Skip
  # those records (counted, not silent) and skip gold-capacity overflows, rather
  # than aborting a multi-hour run. Recorded in JOINT_IE_SCALING.
  error_policy: skip
  on_capacity_exceeded: skip_sample

eval:
  batch_size: 2
  threshold: 0.5
  threshold_sweep: true
  eval_by_language: false

# Unified label space, shared with every model warm-started from this base so they
# all present the same labels. Generated -- see the file header to regenerate.
labels_file: labels/unified.yaml

data:
  # Relation corpora warm the relation head; the event corpora cannot.
  # Every point carries BOTH, at the pool's own 73/27 ratio.
  #
  # THREE CORPORA ADDED 2026-09-15 on top of the 137k mix, and the exclusions matter more
  # than the additions -- see the header note "this is no longer a curve point".
  corpora:
    - data/sentence_rex
    - data/bio_ner_relations
    - data/biored
    # +13,926 relation records, a 38% increase on the 36,707 the 137k mix carries.
    # Wikidata-style properties like sentence_rex, but REGROUPED BY PASSAGE so each record
    # carries all of a passage's triples -- which is the dense multi-relation shape the
    # joint decode exists for, and the shape sentence_rex (one triple per sentence) does
    # not supply. Leakage checked, not assumed: ZERO exact text overlap against
    # sentence_rex, bio_ner_relations and biored.
    - data/professorbob_re
    # Small (265) but the only SCIENTIFIC relation domain in the mix, 7 relation types over
    # AI2 abstracts. Included for domain spread, not volume. Research-use licence.
    - data/scierc
    # The only structure corpus besides text2json, and the reason it is here is
    # event_records: turning events onto the RECORD head increases what that head must do,
    # so giving it more genuine schema-driven structure supervision is directly on-point.
    # Apache-2.0, 378 records -- small, clean, and not a casualty experiment corpus.
    - data/paraloq_json
  event_files:
    chfinann:        {train: data/chfinann.train.jsonl, val: data/scaling_joint/chfinann.val.jsonl, test: data/chfinann.test.jsonl}
    docee:           {train: data/docee.train.jsonl, val: data/scaling_joint/docee.val.jsonl, test: data/docee.test.jsonl}
    docfee:          {train: data/docfee.train.jsonl, val: data/scaling_joint/docfee.val.jsonl, test: data/docfee.test.jsonl}
    duee:            {train: data/duee.train.jsonl, val: data/scaling_joint/duee.val.jsonl}
    cmnee:           {train: data/cmnee.train.jsonl, val: data/scaling_joint/cmnee.val.jsonl, test: data/cmnee.test.jsonl}
    text2json:       {train: data/text2json.train.jsonl, val: data/scaling_joint/text2json.val.jsonl, test: data/text2json.test.jsonl}
    maven:           {train: data/maven.train.jsonl}
    events_biotech:  {train: data/events_biotech.train.jsonl, val: data/scaling_joint/events_biotech.val.jsonl, test: data/events_biotech.test.jsonl}
    mendeley_ed:     {train: data/mendeley_ed.train.jsonl, val: data/scaling_joint/mendeley_ed.val.jsonl, test: data/mendeley_ed.test.jsonl}
    casie:           {train: data/casie.train.jsonl, val: data/scaling_joint/casie.val.jsonl, test: data/casie.test.jsonl}
