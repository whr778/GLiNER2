# PHASE 0: does COMPOSED supervision fix the base's weakest head, at zero annotation spend?
#
# THE DEFECT. eb16's mix presents 8 of 31 possible task combinations, and 11 of its 13
# corpora emit exactly ONE combination at ~100% -- cls+ner from the doc-level event
# corpora, `rel` from sentence_rex alone, `struct` from text2json alone. So a
# combination IS a corpus signature: the model can identify the corpus from the document
# and route to the right heads without reading the requested schema. Measured on the mix
# itself: 54.7% of rows carry 2 tasks and **0.0% carry three or more**. fastino's
# synthetic half is 46.6% all-task-per-sample. The gap is not volume, it is composition.
#
# WHY IT IS NOT COSMETIC. `struct` is 4.9% of the mix and 97% of it is struct-ALONE, so
# the record head never shares a document with entities or classification. On eb16's own
# card it is the worst head by a distance: recall 0.095, F1 0.164, against entity 0.560.
# It is also the head the EKF pipeline depends on. Separately, the shipped
# "Events (ACE-style)" preset asks for entities + events in one call -- a combination
# this mix contains 798 times (0.5%).
#
# THE DATA IS ALREADY BOUGHT. Four corpora carry 3+ tasks per document (62-100% of their
# rows, up to 11 distinct combinations) and have only ever been used in warm-start
# fine-tunes, never in a BASE mix -- which is exactly where the 0.0% lives:
#   cc_news_haiku45       15,839 rows, 62.3% at 3+ tasks   (real news, haiku-4-5)
#   zh_multitask           7,543 rows, 64.2%               (Chinese)
#   synthetic_haiku45_5k   4,018 rows, 92.4%
#   synthetic_sonnet5_1k   1,497 rows, 100.0% (97.3% all five tasks)
# The _coerced and _noreplay twins are EXCLUDED: they re-frame the same documents.
#
# THEY ARE ADDED AS TRAIN-ONLY, VIA event_files, AND THAT IS THE POINT. Putting them in
# `corpora:` would pull their val/test in too and CHANGE THE TEST SET -- the exact
# confound that made the 137k v2 label-unification deltas uninterpretable. The test split
# here is byte-identical to eb16's, so this run is directly comparable to the eb16
# baseline being measured on box B right now, through the same binary and the same
# resolved file list. `maven:` already uses this train-only shape.
#
# CONTAMINATION GATE RUN BEFORE THIS FILE EXISTED, not asserted after: 28,897 unique new
# documents against eb16's 37,358 held-out (val+test) documents -> 0 overlap, and 0
# shared between the four corpora themselves.
#
# zh_multitask TRAINS BUT MUST NOT DRIVE THE LABEL MAP. It is ~70% singletons because the
# annotator invented labels per document; feeding it to build_label_maps.py would
# manufacture thousands of meaningless merges. labels_file is unchanged and NOT
# regenerated for this run -- the label space stays exactly eb16's.
#
# EVERYTHING ELSE IS HELD EQUAL to eb16-rebuild-tr: same encoder, same hyperparameters,
# same epochs, same label space. Composition is the only variable.
#
# PASS BAR, pre-registered: structure F1 +0.02 over the box-B baseline (the measured
# single-run floor is +-0.02, and relations +-0.041). Structure is the most-isolated head
# and has the most to gain. Entity and event must not regress beyond those floors.

model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary     # NOT span -- no max_width here on purpose: that is a
                             # span_head field, and removing the span width cap is
                             # the point of the boundary head (COUNTING_LAYER).
  max_len: 8192
  # FlashAttention 2 is required for CORRECTNESS here, not just speed. Measured on
  # 1x H100, 60 steps of this exact config: sdpa+bf16 goes non-finite at step 15
  # (start/end/pair/soft_iou/rerank all at once) and runs 2.0 samples/s; FA2+bf16
  # is clean for 60 steps at 22.0 samples/s. mmBERT is ModernBERT and is built
  # around FA2 + unpadding (arXiv 2509.06888 Table 8). Needs the 'kernels' package.
  attn_implementation: flash_attention_2
  boundary_head:
    enable_relations: true   # load-bearing: relations decode as edges in the beam
    enable_records: true     # load-bearing: events decode as trigger + role edges
  # No decode_mode here. decode_mode is an EVAL-time switch selecting the greedy or
  # joint arm over ONE trained model (JOINT_IE_SCALING sec 3c); baking it into a
  # training run would make the two arms different models and void the comparison.
  struct_loss: bce_posweight
  struct_pos_weight: 4.0

training:
  output_dir: ./out/eb16-composed
  experiment_name: eb16_composed
  data_parallel: false
  num_epochs: 5              # held equal across the curve (only total volume varies)
  batch_size: 4
  # WARNING, measured not assumed: batch_size is PER-GPU, so this file is a DIFFERENT
  # recipe depending on how it is launched, and the note that used to sit here claimed
  # otherwise.
  #
  #   1 GPU : 4 x 4         = effective 16, 42,730 steps  <- what the 137k v1 base and
  #                                                          the rest of the curve ran
  #   2 GPUs: 4 x 4 x 2     = effective 32, 21,365 steps  <- HALF the optimizer updates
  #
  # v1's model card records "4 (x 4 grad-accum)" on one GPU, and 42,730 steps over
  # 135,635 records x 5 epochs is effective 16 exactly. So a 2-GPU launch doubles the
  # batch and halves the updates rather than matching the curve. Set
  # gradient_accumulation_steps: 2 under torchrun --nproc_per_node=2 to reproduce the
  # curve's optimization, or accept an off-curve base and re-baseline everything
  # downstream of it.
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_loss
  greater_is_better: false
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  # Long documents are WINDOWED, not truncated: a 4096-subword window with a 3072
  # stride (25% overlap) so cross-boundary structure is still seen. mmBERT supports
  # 8192; 4096 keeps attention cost sane. window_stride is set explicitly because
  # the default 256 would give 94% overlap at this window size -- ~16x redundant
  # work on long docs. Docs under 4096 subwords yield a single window unchanged.
  sliding_window: true
  window_stride: 3072
  max_len: 4096
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false
  # ~7-13% of records in chfinann/docfee/casie/text2json cannot be mapped to word
  # token boundaries by the boundary preprocessor even though every surface IS
  # present verbatim in the text (verified). That is an alignment limitation, not
  # bad data, and it hits languages without whitespace delimiters hardest. Skip
  # those records (counted, not silent) and skip gold-capacity overflows, rather
  # than aborting a multi-hour run. Recorded in JOINT_IE_SCALING.
  error_policy: skip
  on_capacity_exceeded: skip_sample

eval:
  batch_size: 2
  threshold: 0.5
  threshold_sweep: true
  eval_by_language: false

# Unified label space, shared with every model warm-started from this base so they
# all present the same labels. Generated -- see the file header to regenerate.
labels_file: labels/unified.yaml

data:
  # Relation corpora warm the relation head; the event corpora cannot.
  # Every point carries BOTH, at the pool's own 73/27 ratio.
  corpora:
  - data/sentence_rex
  - data/bio_ner_relations
  - data/biored
  - data/chfinann
  - data/docee
  - data/docfee
  - data/duee
  - data/cmnee
  - data/text2json
  - data/maven
  - data/events_biotech
  - data/casie
  - data/turkish_event
  event_files:
    chfinann:        {train: data/chfinann.train.jsonl, val: data/scaling_joint/chfinann.val.jsonl, test: data/chfinann.test.jsonl}
    docee:           {train: data/docee.train.jsonl, val: data/scaling_joint/docee.val.jsonl, test: data/docee.test.jsonl}
    docfee:          {train: data/docfee.train.jsonl, val: data/scaling_joint/docfee.val.jsonl, test: data/docfee.test.jsonl}
    duee:            {train: data/duee.train.jsonl, val: data/scaling_joint/duee.val.jsonl}
    cmnee:           {train: data/cmnee.train.jsonl, val: data/scaling_joint/cmnee.val.jsonl, test: data/cmnee.test.jsonl}
    text2json:       {train: data/text2json.train.jsonl, val: data/scaling_joint/text2json.val.jsonl, test: data/text2json.test.jsonl}
    maven:           {train: data/maven.train.jsonl}
    events_biotech:  {train: data/events_biotech.train.jsonl, val: data/scaling_joint/events_biotech.val.jsonl, test: data/events_biotech.test.jsonl}
    mendeley_ed:     {train: data/mendeley_ed.train.jsonl, val: data/scaling_joint/mendeley_ed.val.jsonl, test: data/mendeley_ed.test.jsonl}
    casie:           {train: data/casie.train.jsonl, val: data/scaling_joint/casie.val.jsonl, test: data/casie.test.jsonl}
    # --- PHASE 0, the only difference from eb16-rebuild-tr. TRAIN ONLY, deliberately:
    # no val/test keys, so the held-out split stays byte-identical to the baseline's.
    cc_news_haiku45:      {train: data/cc_news_haiku45.train.jsonl}
    zh_multitask:         {train: data/zh_multitask.train.jsonl}
    synthetic_haiku45_5k: {train: data/synthetic_haiku45_5k.train.jsonl}
    synthetic_sonnet5_1k: {train: data/synthetic_sonnet5_1k.train.jsonl}
