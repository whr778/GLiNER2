# mmBERT head-init scaling curve -- Stage A, ~100K point (Option B, assembled on-disk).
# See tools/events_working_papers/SCALING_CURVE_EXPERIMENT.md.
# from_encoder (fresh GLiNER2 heads) on the FULL structure/argument-dense event pool
# already on disk (~100,080 records, multilingual -- mmBERT handles the zh sets). This
# is the top of the curve; it needs NO subsampling. RAMS/WikiEvents excluded (leakage).
# Fixes the combined base's confounds: structure/argument-dense (not NER-heavy), 5
# epochs (not 2). Downstream RAMS fine-tune warm-starts from this run's ./out/scaling-mmbert-100k/best (Stage B).
# Small shared vals come from build_scaling_mix.py (run it first).
model:
  encoder: jhu-clsp/mmBERT-base
  max_width: 20
  max_len: 8192            # encoder positional capacity (ModernBERT/RoPE)
  struct_loss: bce_posweight
  struct_pos_weight: 4.0
  

training:
  output_dir: ./out/scaling-mmbert-100k
  experiment_name: scaling_mmbert_100k
  data_parallel: false
  num_epochs: 5              # fastino-like; fixes the combined base's 2-epoch confound
  batch_size: 4              # mmBERT-base at 2048 OOM'd the 40GB A100 at batch 8
  gradient_accumulation_steps: 8   # effective batch 32
  encoder_lr: 2.0e-5         # from_encoder: training fresh heads
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_loss   # multi-task base: best all-round checkpoint
  greater_is_better: false
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  sliding_window: false      # event docs fit in max_len -> native long context
  max_len: 2048              # training window; holds any record + schema prompt
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false      # run all 5 epochs so the argument head develops

eval:
  batch_size: 2              # long docs padded x8 OOM'd epoch-end eval at higher batch
  threshold: 0.5
  threshold_sweep: true      # calibrate the decision threshold on val
  eval_by_language: false    # no metric_sweep: base run, eval_loss selection is enough

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  corpora: []
  event_files:
    chfinann:       {train: data/chfinann.train.jsonl,       val: data/scaling/chfinann.val.jsonl}
    docee:          {train: data/docee.train.jsonl,          val: data/scaling/docee.val.jsonl}
    docfee:         {train: data/docfee.train.jsonl,         val: data/scaling/docfee.val.jsonl}
    duee:           {train: data/duee.train.jsonl,           val: data/scaling/duee.val.jsonl}
    cmnee:          {train: data/cmnee.train.jsonl,          val: data/scaling/cmnee.val.jsonl}
    text2json:      {train: data/text2json.train.jsonl,      val: data/scaling/text2json.val.jsonl}
    maven:          {train: data/maven.train.jsonl}
    events_biotech: {train: data/events_biotech.train.jsonl, val: data/scaling/events_biotech.val.jsonl}
    mendeley_ed:    {train: data/mendeley_ed.train.jsonl,    val: data/scaling/mendeley_ed.val.jsonl}
    casie:          {train: data/casie.train.jsonl,          val: data/scaling/casie.val.jsonl}
