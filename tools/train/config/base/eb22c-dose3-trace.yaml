# eb22c-dose3-trace -- GENERATED by tools/train/make_eb22c_bisect_configs.py from base/eb22c-bce-trace.yaml.
# eb22c-bce-trace with ONE training change: negative_labels_per_dim 20/20 -> 3/3.
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary
  max_len: 8192
  attn_implementation: flash_attention_2
  boundary_head:
    max_gold_per_query: 768
    training_candidate_budget: 768
    candidate_budget: 384
    start_top_k: 128
    end_top_k: 128
    candidate_pool: per_query
    enable_relations: true
    enable_records: true
    event_records: true
    record_role_hard_negatives: 8
    proposal_gold: identity
    record_link_mode: junction
    record_link_column_weight: 0.3
    record_coreferent_ownership: true
    record_coref_link: true
    record_coref_link_weight: 0.3
    record_coref_link_negatives: 4
    relation_biaffine_content: true
    directional_relation_states: true
    enable_span_content: true
    enable_rotary_endpoints: true
    endpoint_difference_features: true
    query_conditioned_inside_weight: true
    boundary_attention_layers: 2
    boundary_attention_window: 128
    boundary_marginal_loss: bce
    boundary_negative_weight: 0.5
    boundary_top_k_alpha: 0.08
    hard_negatives_per_positive: 20
    minimum_hard_negatives: 16
    hard_negative_keep_all_when_absent: true
    negative_query_ratio: 1.0
    relation_pair_cap: 64
    relation_argument_proposal_threshold: 0.2
    entity_coref_link: true
    entity_coref_link_weight: 0.3
    entity_coref_link_negatives: 4
training:
  negative_pools: auto
  negative_labels_per_dim:
    entities: 3
    events: 3
  negative_label_seed: 42
  output_dir: ./out/eb22c-dose3-trace
  experiment_name: eb22c-dose3-trace
  data_parallel: false
  num_epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-05
  task_lr: 0.0005
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: steps
  metric_for_best: eval_overall_strict_head_min_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 30
  logging_steps: 20
  num_workers: 4
  validate_data: true
  sliding_window: true
  window_stride: 3072
  max_len: 4096
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  error_policy: skip
  on_capacity_exceeded: truncate_with_warning
  negative_gold_full_roles: true
  relation_gold_pairs: nearest
  eval_steps: 1000
  max_eval_samples: 1500
eval:
  batch_size: 2
  threshold: 0.3
  threshold_sweep: true
  eval_by_language: true
  global_decode: true
  coref_calibration:
  - data/cc_news_events_sonnet55_v2
  app_menus:
    news55: menus/news55.json
  menu: app:news55
  coref_control:
  - data/cmnee
  - data/maven
labels_file: labels/unified-full-v4.yaml
data:
  corpora:
  - data/sentence_rex
  - data/bio_ner_relations
  - data/biored
  - data/chfinann
