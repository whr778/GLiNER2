# mmBERT head-init scaling curve -- Stage B, ~100K point. Fine-tune the warmed 100K
# base (scaling-mmbert-100k Stage A) on RAMS. See SCALING_CURVE_EXPERIMENT.md.
# Identical downstream recipe to mmbert-base-rams / scaling-mmbert-10k-rams; only the
# warm-start source differs. Produces the top point's RAMS arg-strict F1.
model:
  pretrained: ./out/scaling-mmbert-100k/best
  struct_loss: bce_posweight
  struct_pos_weight: 4.0

training:
  checkpoint_restart: last
  output_dir: ./out/scaling-mmbert-100k-rams
  experiment_name: scaling_mmbert_100k_rams
  data_parallel: false
  num_epochs: 15
  batch_size: 8
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_event_argument_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 10
  num_workers: 0
  validate_data: false
  sliding_window: false
  max_len: 2048
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false

eval:
  batch_size: 8
  threshold: 0.5
  threshold_sweep: true
  metric_sweep: true
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  corpora: []
  event_files:
    rams:
      train: data/rams.train.jsonl
      val: data/rams.dev.jsonl
      test: data/rams.test.jsonl
