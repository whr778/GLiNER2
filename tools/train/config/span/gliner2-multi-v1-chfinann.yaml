# Fine-tune the pretrained fastino/gliner2-multi-v1 GLiNER2 model on ChFinAnn
# (Chinese financial document-level event extraction, Doc2EDAG). ChFinAnn is
# TRIGGER-FREE, so the converter emits role-typed entities + multi-label
# event-type classification (no events block) -- hence metric_for_best is the
# classification F1, not the event F1 (an absent event metric would break
# best-checkpoint selection).
model:
  pretrained: fastino/gliner2-multi-v1

training:
  checkpoint_restart: last # highest, last, or None
  output_dir: ./out/fastino/gliner2-multi-v1-chfinann
  experiment_name: gliner2-multi-v1_chfinann
  data_parallel: false
  num_epochs: 15
  batch_size: 16
  gradient_accumulation_steps: 2
  encoder_lr: 1.0e-5         # lower LR than from-scratch: fine-tuning a trained model
  task_lr: 3.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_classification_strict_micro_f1   # triggerless -> classify event type
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 10
  num_workers: 0
  validate_data: false
  sliding_window: true
  max_len: 384               # deberta-v3 caps at 512 positions; leave room for
  window_stride: 256         # the prepended schema + special tokens (512 overflows)
  gradient_checkpointing: false
  pin_memory: false

  early_stopping: true        # Enable early stopping.
  early_stopping_patience: 3  # Patience for early stopping.


eval:
  batch_size: 1
  threshold: 0.5
  # Document-level: window long announcements (ChFinAnn docs are long).
  chunk_size: 384        # word window (matches training max_len)
  chunk_overlap: 128     # overlap so a mention recurs across windows
  global_decode: true    # OneIE-style cross-window assembly (no-op without events)
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  corpora: []
  event_files:
    chfinann:
      train: data/chfinann.train.jsonl
      val: data/chfinann.val.jsonl
      test: data/chfinann.test.jsonl
