# Fine-tune the pretrained fastino/gliner2-base-v1 GLiNER2 model on RE-DocRED
# (re-annotated DocRED: document-level NER + relation extraction). Uses
# from_pretrained (continues the model's existing heads); contrast with the
# mmbert-* configs, which bootstrap fresh heads on a raw encoder via from_encoder.
model:
  pretrained: fastino/gliner2-base-v1
  # Optional: override the checkpoint's loss for continued training, e.g.
  # struct_loss: focal
  # focal_gamma: 2.0
  # focal_alpha: 0.25

training:
  checkpoint_restart: last # highest, last, or None
  output_dir: ./out/fastino/gliner2-base-v1-redocred
  experiment_name: gliner2-base-v1_redocred
  data_parallel: false
  num_epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 2   # effective batch 16
  encoder_lr: 1.0e-5         # lower LR than from-scratch: fine-tuning a trained model
  task_lr: 3.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  # RE-DocRED is a relation corpus: select the checkpoint by relation F1, not loss.
  metric_for_best: eval_relation_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 10
  num_workers: 0
  validate_data: false
  sliding_window: true
  max_len: 256               # deberta-v3 caps at 512 positions; leave room for
  window_stride: 128         # the prepended schema + special tokens (512 overflows)
  gradient_checkpointing: false
  pin_memory: false

  early_stopping: true        # stop once relation F1 stops improving
  early_stopping_patience: 3

eval:
  batch_size: 8
  threshold: 0.5
  # Documents run up to ~500 words (>512 subwords), so window eval too, matching
  # training's sliding window, to avoid the position-cap overflow on long docs.
  chunk_size: 256        # word window (matches training max_len)
  chunk_overlap: 128     # 50% overlap so cross-window relations are recoverable
  eval_by_language: false
  # stopword_languages: [eng, fra, deu, zho, jpn, kor, uzb, kat]
  # stopword_yaml: stopwords.yaml  # relative to this config file; defaults to stopwords.yaml

labels:
  entities:
    rollup: false
    separator: "."
    map: {}          # e.g. {ORG: ORGANIZATION} to rename labels after roll-up
  relations:
    rollup: false
    separator: "."
    map: {}          # e.g. {ORG: ORGANIZATION} to rename labels after roll-up
  events:
    rollup: false
    separator: "."
    map: {}          # e.g. {ORG: ORGANIZATION} to rename labels after roll-up

# RE-DocRED is a NER + relation corpus (no events), so it goes under `corpora`,
# which auto-derives data/redocred.{train,val,test}.jsonl.
data:
  corpora:
    - data/redocred
  event_files: {}
