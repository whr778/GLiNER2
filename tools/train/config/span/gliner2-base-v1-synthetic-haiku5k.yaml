# SANITY CHECK: fine-tune the pretrained fastino/gliner2-base-v1 GLiNER2 model on
# ONLY synthetic_haiku45_5k (entities, relations, events, classification,
# structures). from_pretrained continues the model's trained heads (the standard
# base-v1 recipe). Question: does fine-tuning the good base-v1 model on our
# synthetic data preserve or degrade it? DeBERTa-v3-base, 512-position cap ->
# 384-word sliding window.
#
# Twin of gliner2-base-v1-synthetic.yaml, which points at the older, narrower
# synthetic_sonnet5_1k. Everything but the corpus and the selection metric is
# identical, so the two runs are comparable.
model:
  pretrained: fastino/gliner2-base-v1

training:
  checkpoint_restart: None
  output_dir: ./out/gliner2-base-v1-synthetic-haiku5k
  experiment_name: gliner2_base_v1_synthetic_haiku5k
  data_parallel: false
  num_epochs: 10             # run all epochs for per-epoch reporting
  batch_size: 8              # A10 22GB: batch 16 OOM'd in deberta disentangled attn (seq^2); halved
  gradient_accumulation_steps: 4   # effective batch 32
  encoder_lr: 1.0e-5         # lower LR: fine-tuning a trained model
  task_lr: 3.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: false
  fp16: true
  max_grad_norm: 1.0
  eval_strategy: epoch
  # Entities only, deliberately: the fair regime (Ortmann 2022) exists for span
  # categories, and entities are by far this corpus's largest signal (~39k
  # annotations, ~91% type purity). eval_loss -- what the sonnet twin selects on --
  # is an all-round number but not a task score, and a loss cannot say whether the
  # model still extracts well. Relations, classifications and structures are still
  # reported every epoch; they just do not drive selection.
  metric_for_best: eval_entity_fair_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 10
  num_workers: 0
  validate_data: false
  sliding_window: true       # deberta-v3 caps at 512 positions
  max_len: 384               # word window (leaves room for the schema prompt)
  window_stride: 256
  gradient_checkpointing: false
  pin_memory: false
  early_stopping: false      # run all 10 epochs so each epoch reports

eval:
  batch_size: 8
  threshold: 0.5
  threshold_sweep: true      # calibrate the decision threshold on val for the blind test
  global_decode: false       # synthetic passages are short + local; no cross-window assembly
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  corpora:
    - data/synthetic_haiku45_5k   # 4,997 records, 5 task types, entity negatives
  event_files: {}
