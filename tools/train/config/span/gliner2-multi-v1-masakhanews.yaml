# Fine-tune the pretrained fastino/gliner2-multi-v1 GLiNER2 model on
# MasakhaNEWS (Adelani et al., IJCNLP-AACL 2023): news-topic classification over
# 16 African languages, 7 topics (business/entertainment/health/politics/
# religion/sports/technology). The multilingual checkpoint continues its
# classification head via from_pretrained. Contrast the mmbert-base variant,
# which bootstraps fresh heads on a raw encoder via from_encoder.
#
# LANGUAGE SELECTION lives in `data.corpora` below: `data/masakhanews` is all
# languages the converter emitted; swap in per-language corpora (e.g.
# `data/masakhanews_swa`) to train on a subset. Regenerate with:
#   uv run python tools/data/convert_masakhanews.py --out data/masakhanews.jsonl \
#       --langs all            # or e.g. --langs swa,hau,yor
model:
  pretrained: fastino/gliner2-multi-v1

training:
  checkpoint_restart: last
  output_dir: ./out/fastino/gliner2-multi-v1-masakhanews
  experiment_name: gliner2-multi-v1_masakhanews
  data_parallel: false
  num_epochs: 10
  batch_size: 16
  gradient_accumulation_steps: 2
  encoder_lr: 1.0e-5         # lower LR than from-scratch: fine-tuning a trained model
  task_lr: 3.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_classification_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 10
  num_workers: 0
  validate_data: false
  sliding_window: false      # one label per article -> classify the doc, don't window
  max_len: 512               # mDeBERTa-v3 cap; long articles truncate (lead is enough)
  gradient_checkpointing: false
  pin_memory: false
  early_stopping: true
  early_stopping_patience: 3

eval:
  batch_size: 8
  threshold: 0.5             # single-label classification is argmax-based
  # Blind test reports the combined (all-language) accuracy/F1. For per-language
  # numbers, evaluate each data/masakhanews_<lang>.test.jsonl the converter emits.
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  # All converted languages. For a subset, list per-language corpora instead, e.g.
  #   - data/masakhanews_swa
  #   - data/masakhanews_hau
  #   - data/masakhanews_yor
  corpora:
    - data/masakhanews
  event_files: {}
