# mmBERT-base on MasakhaNER 2.0, from a raw encoder (from_encoder = fresh
# GLiNER2 heads). MasakhaNER 2.0 (Adelani et al., EMNLP 2022) is human-annotated
# NER over 20 African languages with four entity types
# (person/organization/location/date). mmBERT is a massively multilingual
# backbone, so its from-encoder heads see all 20 languages jointly. Contrast the
# gliner2-multi-v1 variant, which fine-tunes an already-trained entity head.
#
# LANGUAGE SELECTION lives in `data.corpora` below: `data/masakhaner` is all
# languages the converter emitted; swap in per-language corpora (e.g.
# `data/masakhaner_swa`) to train on a subset. Regenerate with:
#   uv run python tools/data/convert_masakhaner.py --out data/masakhaner.jsonl \
#       --langs all            # or e.g. --langs hau,yor,swa
model:
  encoder: jhu-clsp/mmBERT-base
  max_width: 20
  max_len: 8192            # encoder positional capacity (ModernBERT/RoPE)
  struct_loss: bce         # entities are dense enough that plain BCE suffices
                           # (no pos_weight, unlike the sparse RAMS argument head)

training:
  output_dir: ./out/mmbert-base-masakhaner
  experiment_name: mmbert_base_masakhaner
  data_parallel: false
  num_epochs: 10             # fresh heads need more passes than fine-tuning
  batch_size: 16
  gradient_accumulation_steps: 2   # effective batch 32
  encoder_lr: 2.0e-5         # from_encoder: training fresh heads
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_entity_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 10
  num_workers: 0
  validate_data: false
  sliding_window: false      # NER sentences are short (~30 words) -> no windowing
  max_len: 256               # training window; sentences fit easily
  gradient_checkpointing: false
  pin_memory: false
  early_stopping: false      # run all epochs so the fresh entity head fully develops
  early_stopping_patience: 3

eval:
  batch_size: 8
  threshold: 0.5
  threshold_sweep: true      # calibrate the decision threshold on val (blind test)
  metric_sweep: true         # per-epoch: sweep threshold + select the best checkpoint
                             # at its own best threshold (proper selection for fresh
                             # heads whose score scale shifts across epochs)
  # Blind test reports the combined (all-language) strict micro-F1. For accurate
  # PER-LANGUAGE numbers, evaluate each data/masakhaner_<lang>.test.jsonl the
  # converter emits (automatic language ID over 20 low-resource languages is
  # unreliable, so eval_by_language is left off).
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  # All converted languages. For a subset, list per-language corpora instead, e.g.
  #   - data/masakhaner_swa
  #   - data/masakhaner_hau
  #   - data/masakhaner_yor
  corpora:
    - data/masakhaner
  event_files: {}
