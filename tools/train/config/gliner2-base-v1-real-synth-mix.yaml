# The real + synthetic MIXTURE arm: real CC-News text and generated passages
# together, both annotated by claude-haiku-4-5. Fine-tunes fastino/gliner2-base-v1.
#
# Reads against three existing arms that each hold one leg fixed:
#   gliner2-base-v1-synthetic-haiku5k  synthetic text only
#   gliner2-base-v1-ccnews-real        real text only
#   this                               both
# So the mixture is only worth adopting if it beats BOTH singles, not just one.
#
# THE RATIO IS NOT FASTINO'S, and that is deliberate. Their reported mixture is 47%
# synthetic / 53% real. What is on disk is 19,956 real and 6,879 synthetic =
# **74.4% real / 25.6% synthetic**. Hitting 53/47 needs one of:
#   * capping real at 7,757 documents -- throws away 12,199 annotations already paid
#     for, and shrinks the arm below the singles it is being compared against; or
#   * generating 10,818 more synthetic records (~$30 batch at haiku-4-5) to use all
#     the real data.
# Neither is free, so this arm uses everything and states its real ratio. Do not
# describe it as reproducing the 47/53 recipe -- it does not.
#
# Note the two synthetic corpora are not interchangeable: synthetic_sonnet5_1k has a
# narrow ontology, ZERO negatives, and uses the `json_structures` key, while
# synthetic_haiku45_5k has the full 125-type ontology with 12 seeded negatives per
# document. Mixing them is a deliberate breadth choice, not a neutral concatenation.
#
# Corpus caveats for the real half (license `unknown`, 18% single-domain skew, sparse
# events/structures) are recorded in gliner2-base-v1-ccnews-real.yaml and the dataset
# registry; they apply here unchanged.
model:
  pretrained: fastino/gliner2-base-v1

training:
  checkpoint_restart: None
  output_dir: ./out/gliner2-base-v1-real-synth-mix
  experiment_name: gliner2_base_v1_real_synth_mix
  data_parallel: false
  num_epochs: 10             # run all epochs for per-epoch reporting
  batch_size: 8              # A10 22GB: batch 16 OOM'd in deberta disentangled attn (seq^2); halved
  gradient_accumulation_steps: 4   # effective batch 32
  encoder_lr: 1.0e-5         # lower LR: fine-tuning a trained model
  task_lr: 3.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: false
  fp16: true
  max_grad_norm: 1.0
  eval_strategy: epoch
  # Entities, matching every arm in the set. Changing the selection metric here would
  # make the mixture incomparable to the two singles, which is the entire point.
  metric_for_best: eval_entity_fair_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 10
  num_workers: 0
  validate_data: false
  sliding_window: true       # deberta-v3 caps at 512 positions
  max_len: 384               # word window (leaves room for the schema prompt)
  window_stride: 256
  gradient_checkpointing: false
  pin_memory: false
  early_stopping: false      # run all 10 epochs so each epoch reports

eval:
  batch_size: 8
  threshold: 0.5
  threshold_sweep: true      # calibrate the decision threshold on val for the blind test
  global_decode: true        # the real half spans windows; see the ccnews-real arm
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  corpora:
    - data/cc_news_haiku45        # ~19,956 real CC-News docs, haiku-4-5 annotations
    - data/synthetic_haiku45_5k   # 4,997 generated docs, same annotator, full ontology
    - data/synthetic_sonnet5_1k   # 1,882 generated docs, narrow ontology, no negatives
  event_files: {}
