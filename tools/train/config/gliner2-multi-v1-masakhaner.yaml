# Fine-tune the pretrained fastino/gliner2-multi-v1 GLiNER2 model on
# MasakhaNER 2.0 (Adelani et al., EMNLP 2022): human-annotated NER over 20
# African languages, four entity types (person/organization/location/date).
# The multilingual checkpoint (mDeBERTa-v3 backbone) is a natural fit; this
# continues its entity head via from_pretrained. Contrast the mmbert-base
# variant, which bootstraps fresh heads on a raw encoder via from_encoder.
#
# LANGUAGE SELECTION lives in `data.corpora` below: `data/masakhaner` is all
# languages the converter emitted; swap in per-language corpora (e.g.
# `data/masakhaner_swa`) to train on a subset. Regenerate with:
#   uv run python tools/data/convert_masakhaner.py --out data/masakhaner.jsonl \
#       --langs all            # or e.g. --langs hau,yor,swa
model:
  pretrained: fastino/gliner2-multi-v1

training:
  checkpoint_restart: last # highest, last, or None
  output_dir: ./out/fastino/gliner2-multi-v1-masakhaner
  experiment_name: gliner2-multi-v1_masakhaner
  data_parallel: false
  num_epochs: 10
  batch_size: 16
  gradient_accumulation_steps: 2
  encoder_lr: 1.0e-5         # lower LR than from-scratch: fine-tuning a trained model
  task_lr: 3.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_entity_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 3
  logging_steps: 10
  num_workers: 0
  validate_data: false
  sliding_window: false      # NER sentences are short (~30 words) -> no windowing
  max_len: 256               # mDeBERTa-v3 caps at 512 positions; sentences fit easily
  gradient_checkpointing: false
  pin_memory: false
  early_stopping: true
  early_stopping_patience: 3

eval:
  batch_size: 8
  threshold: 0.5
  # Blind test reports the combined (all-language) strict micro-F1. For accurate
  # PER-LANGUAGE numbers, evaluate each data/masakhaner_<lang>.test.jsonl the
  # converter emits (automatic language ID over 20 low-resource languages is
  # unreliable, so eval_by_language is left off).
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}          # e.g. {person: PER} to rename labels
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  # All converted languages. For a subset, list per-language corpora instead, e.g.
  #   - data/masakhaner_swa
  #   - data/masakhaner_hau
  #   - data/masakhaner_yor
  corpora:
    - data/masakhaner
  event_files: {}
