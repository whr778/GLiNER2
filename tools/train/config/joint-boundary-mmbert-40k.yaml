# joint_ie x head-init scaling -- BOUNDARY cold-start base, ~40K TOTAL records.
# See tools/events_working_papers/JOINT_IE_SCALING.md (sec 3b design, sec 4 experiment).
#
# NEW output paths/names on purpose: this does NOT overwrite the span-architecture
# scaling-mmbert-*.yaml runs, their ./out/scaling-mmbert-* dirs, or anything already
# pushed to HF. Those were span bases (sec 3c); these are the boundary bases the
# joint_ie decode arms need.
#
# Sizes are TOTAL mix records, and EVERY point carries both event and relation data
# at the pool's own ratio (events 73.02% / relations 26.98%), so the only factor
# varying across the curve is volume -- not whether the relation head was warmed at
# all. Slices built by tools/train/build_joint_scaling_mix.py (seed 42, nested).
#
#   this point: 29,209 event + 10,791 relation records
#
# RAMS / Re-DocRED / WikiEvents excluded from the base mix (they are the downstreams).
# DocRED excluded too: Re-DocRED re-annotates the same documents (leakage).
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary     # NOT span -- no max_width here on purpose: that is a
                             # span_head field, and removing the span width cap is
                             # the point of the boundary head (COUNTING_LAYER).
  max_len: 8192
  boundary_head:
    enable_relations: true   # load-bearing: relations decode as edges in the beam
    enable_records: true     # load-bearing: events decode as trigger + role edges
  # No decode_mode here. decode_mode is an EVAL-time switch selecting the greedy or
  # joint arm over ONE trained model (JOINT_IE_SCALING sec 3c); baking it into a
  # training run would make the two arms different models and void the comparison.
  struct_loss: bce_posweight
  struct_pos_weight: 4.0

training:
  output_dir: ./out/joint-boundary-mmbert-40k
  experiment_name: joint_boundary_mmbert_40k
  data_parallel: false
  num_epochs: 5              # held equal across the curve (only total volume varies)
  batch_size: 4
  gradient_accumulation_steps: 8
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_loss
  greater_is_better: false
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  sliding_window: false
  max_len: 2048
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false

eval:
  batch_size: 2
  threshold: 0.5
  threshold_sweep: true
  eval_by_language: false

labels:
  entities:
    rollup: false
    separator: "."
    map: {}
  relations:
    rollup: false
    separator: "."
    map: {}
  events:
    rollup: false
    separator: "."
    map: {}

data:
  # Relation corpora warm the relation head; the event corpora cannot.
  # Every point carries BOTH, at the pool's own 73/27 ratio.
  corpora:
    - data/scaling_joint/sentence_rex.j40k
    - data/scaling_joint/bio_ner_relations.j40k
    - data/scaling_joint/biored.j40k
    - data/scaling_joint/scierc.j40k
  event_files:
    chfinann:        {train: data/scaling_joint/chfinann.j40k.train.jsonl, val: data/scaling_joint/chfinann.val.jsonl}
    docee:           {train: data/scaling_joint/docee.j40k.train.jsonl, val: data/scaling_joint/docee.val.jsonl}
    docfee:          {train: data/scaling_joint/docfee.j40k.train.jsonl, val: data/scaling_joint/docfee.val.jsonl}
    duee:            {train: data/scaling_joint/duee.j40k.train.jsonl, val: data/scaling_joint/duee.val.jsonl}
    cmnee:           {train: data/scaling_joint/cmnee.j40k.train.jsonl, val: data/scaling_joint/cmnee.val.jsonl}
    text2json:       {train: data/scaling_joint/text2json.j40k.train.jsonl, val: data/scaling_joint/text2json.val.jsonl}
    maven:           {train: data/scaling_joint/maven.j40k.train.jsonl}
    events_biotech:  {train: data/scaling_joint/events_biotech.j40k.train.jsonl, val: data/scaling_joint/events_biotech.val.jsonl}
    mendeley_ed:     {train: data/scaling_joint/mendeley_ed.j40k.train.jsonl, val: data/scaling_joint/mendeley_ed.val.jsonl}
    casie:           {train: data/scaling_joint/casie.j40k.train.jsonl, val: data/scaling_joint/casie.val.jsonl}
