# CMNEE (zh) single-dataset fine-tune from fastino/gliner2.5-multi-v1.
#
# Pair: cmnee-eb23a.yaml. Same data, dose, and schedule. The pretrained checkpoint is the difference.
# Train is offset-anchored. Those rows also carry partial LLM entity labels, so entity negatives are withheld. Val and test are the human event splits.
# Train ontology measured 2026-11-24 on 9281 train documents: events: 8. No relation gold, so no relation dose.
# Select on eval_event_argument_strict_micro_f1. Single-run floor: ±0.02 strict micro-F1.
model:
  pretrained: fastino/gliner2.5-multi-v1
  architecture: boundary
  boundary_head:
    record_coref_link_weight: 0.0
    record_argument_coref_copy: none
    record_argument_coref_boost: 0.0
    report_task_losses: true
    loss_reduction: global  # checkpoint ships sum; the task-loss report rejects it

training:
  checkpoint_restart: null
  output_dir: ./out/events/cmnee-multi
  experiment_name: cmnee_multi
  data_parallel: false
  num_epochs: 4
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 2.0e-5
  task_lr: 2.0e-4
  encoder_lr_backbone_only: true
  warmup_ratio: 0.10
  scheduler_type: cosine
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  gold_injection_start: 0.75
  gold_injection_end: 0.25
  eval_strategy: epoch
  metric_for_best: eval_event_argument_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  save_epoch_checkpoint: true
  logging_steps: 10
  num_workers: 2
  validate_data: false
  allow_invalid_samples: true
  ignore_missing_entities: true
  suppress_orphaned_queries: true
  error_policy: skip
  on_capacity_exceeded: truncate_with_warning
  negative_pools: auto
  negative_labels_per_dim:
    events: 8
  negative_label_seed: 42
  negative_gold_full_roles: true
  expand_argument_coref: false
  schema_dropout: false
  sliding_window: true
  max_len: 4096
  window_stride: 3072
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  seed: 42
  default_schema_mode: dataset

eval:
  batch_size: 2
  threshold: 0.3
  threshold_sweep: true
  calibration_menu: model_schema
  global_decode: true
  eval_by_language: false
  metric_sweep: true
  model_schema: true

labels_file: labels/unified-full-v4.yaml

data:
  partial_annotation:
    cmnee_ner_off:
      - entities
  corpora: []
  event_files:
    cmnee:
      train: data/cmnee_ner_off.train.jsonl
      val: data/cmnee.val.jsonl
      test: data/cmnee.test.jsonl
