# Unified label space -- GENERATED by tools/train/build_label_maps.py.
# Regenerate after any data change:
#   uv run python tools/train/build_label_maps.py <configs/jsonl...> --out tools/train/config/labels/unified.yaml
#
# GLiNER2 takes the label as an INPUT string, so 'CompanyName' and 'Company Name'
# are two queries for one field. Every model warm-started from a base must present
# that base's label space, so configs reference this ONE file via `labels_file:`
# rather than carrying copies that drift.
#
# Same-category clusters only. 'target' is excluded on purpose: docee's Target is
# who an attack hit, bio_ner_relations' is a kinase substrate. Labels folding to an
# empty string (the POS tags ',', '.', '-LRB-') are left alone.
labels:
  entities:
    rollup: false
    separator: .
    map:
      Company Name: CompanyName
      Start Date: StartDate
      End Date: EndDate
      Economic loss: Economic Loss
      Areas Affected: Areas affected
      Start_Date: StartDate
      organization: Organization
      gene: Gene
      Species: species
      End_Date: EndDate
