# Language-BALANCED casualty structure model: English, Turkish, Simplified Chinese.
#
# WHY THIS EXISTS. Every casualty corpus in this repo is 100% English and 100% LLM-written
# text, so the extractor learns the register of synthetic disaster copy and does poorly on
# real wire copy -- this line's standing in-domain-good / real-news-poor failure. Measured
# on the EKF front end's own mix: 71.4% of English trigger+argument records are synthetic,
# and one corpus (casualty_events) supplies 62% of them.
#
# What was sitting unused, already annotated and already paid for, in exactly the schema
# the EKF consumes (`casualty_report`, mode/anchor):
#
#   turkish_gate/cas_ann_tr    31,263 docs / 40,109 instances  REAL Turkish news
#   chinese_gate/cas_ann_zh*   20,901 docs / 28,722 instances  REAL Chinese news
#   casualty_natural           29,324 docs / 72,733 instances  synthetic English
#
# CORRECTION, dated 2026-09-02. An earlier version of this file stated "Chinese -- there is
# none. 4 of 818,776 casualty_report structures across every corpus on disk are Chinese."
# That was wrong. The 20,901 Chinese records live in data/chinese_gate/, a subdirectory the
# scan treated as scratch rather than as a corpus, so it looked at data/*.jsonl and found
# nothing. They are real news, field-level, and location-rich (26,163 fills).
#
# BALANCED BY DOWNSAMPLING to the smallest language (20,901 each, 62,703 total), so no arm
# wins on volume. Built by tools/train/build_casualty_multilingual.py; verified 0 duplicates
# within each split, 0 overlap across splits, 0 overlap across languages, and 33.3% per
# language in train, val AND test -- an unbalanced test set would hide a monolingual model.
#
# ALL THREE ARMS ARE REAL NEWS as of 2026-09-03. The English arm was synthetic because no
# real-news English casualty corpus existed; two purchases built one:
#   cas_ann_en      9,648 rows  DocEE, ~$20   (30.4% base rate, 53.0% after the free regex)
#   cas_ann_ccnews 12,491 rows  CC-News, ~$45 (model-screened: regex then the extractor)
# 22,139 English against Turkish 31,263 and Chinese 20,901, so the balance holds at 20,901.
#
# THE BLIND TEST IS BLIND, and this needed forcing. The 137k base TRAINED on docee.train,
# so 6,247 English rows are text it has already read: fine to train on, not fine to score.
# Pinning them to train shrinks the English eval pool, and letting 80/10/10 absorb that
# gave a test set of 25.1% English against 37.5% Turkish -- the exact failure this corpus
# exists to avoid. val and test are therefore sized EQUALLY per language by construction
# (1,400 each, base-unseen only) and train takes the remainder.
#
# Verified: 62,703 records, 33.2/33.4/33.4 per language in EVERY split, 0 duplicates,
# 0 cross-split overlap, 0 base-trained rows in val or test, 100% record_metadata,
# 0 Chinese labels, check_leakage --config CLEAN.

# REBASED 2026-09-05 onto the trilingual base. The previous base,
# 137k-v2-eb16, had NEVER SEEN TURKISH while this model fine-tunes Turkish onto it --
# the gap eb16-rebuild-tr was built to close (30,134 Turkish rows, 18.2% of its corpus).
# Structurally compatible, verified against the published config rather than assumed:
# enable_records/enable_relations both true (they are STRUCTURAL on a `pretrained:` path
# and must match), max_len 8192, and the same labels_file -- a warm start against a
# vocabulary the base never learned is not a warm start.
#
# THE ONLY VARIABLE vs the 2026-09-05 run is the base. Same config, same seed, same
# corpus, same length proxy, so the delta is attributable. That run (old base, charclass
# proxy) scored structure_strict 0.5958 / relaxed 0.6208 on support 10,506 -- the control.
#
# CAVEAT, recorded rather than buried: eb16-rebuild-tr was itself trained with the
# charclass length proxy, and three independent observations now put that proxy at
# net-negative (Chinese -0.028, gate3 admission down, and this model's own
# 0.6078 -> 0.5958 structure_strict across the proxy change on an identical test set).
# This run inherits that. It is not a confound for the base comparison -- both arms use
# charclass -- but it means a positive result here is a floor, not a ceiling.
model:
  pretrained: whr778/gliner2-eb16-rebuild-tr
  architecture: boundary
  boundary_head:
    enable_relations: true
    enable_records: true
    # Defaults 32/160. The replay pool holds documents with 121 gold spans for one query.
    max_gold_per_query: 256
    training_candidate_budget: 1024
training:
  checkpoint_restart: None
  output_dir: ./out/casualty-multilingual-eb16tr
  experiment_name: casualty_multilingual_eb16tr
  data_parallel: false          # DEPRECATED no-op; DDP comes from torchrun, not config
  # 4, not 6, on measured cost rather than a guess: 54,303 records at effective batch 32
  # is 1,697 steps per epoch, and the A100 runs 3.46 s/it, so 6 epochs is 9.5h of training
  # -- past the 8h cap, which would kill the process before the blind test and the
  # threshold sweep ever run and leave the one number this corpus exists to produce
  # unmeasured. 4 epochs is 6.2h, and the whole job including the sweep fits in 7h.
  # Cheap insurance either way: metric_for_best selects on val, and this line's earlier
  # loc-split arm saturated at epoch 1.
  num_epochs: 4
  batch_size: 2
  gradient_accumulation_steps: 16     # effective 32
  encoder_lr: 2.0e-5
  task_lr: 5.0e-4
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true                    # fp16 crashed this workload at 79% on 2026-08-17
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_structure_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 50
  num_workers: 2
  validate_data: false
  # Chinese and Turkish surfaces do not always word-align on the boundary path (no
  # whitespace delimiters in Chinese). Drops the single mention, not the record's other gold.
  allow_invalid_samples: true
  sliding_window: true
  max_len: 8192                 # matches the base
  window_stride: 6144
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
eval:
  metric_sweep: true
# Same unified label space as the base this warm-starts from -- a warm start against
# a different vocabulary is a warm start the base never learned.
labels_file: labels/unified.yaml

data:
  corpora:
    - data/casualty_ml
  event_files: {}
