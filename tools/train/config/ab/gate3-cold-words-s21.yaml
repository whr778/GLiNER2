# A/B cell: base=cold proxy=words seed=21. Generated by an inline script;
# edit the generator, not this file. See MULTILINGUAL_RECIPE.md step 8.
# 6 epochs not 8: every gate3 seed peaked at 4-5 and 6-8 only overfit.
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary
  max_len: 2048
  attn_implementation: flash_attention_2
  boundary_head:
    enable_relations: false
    enable_records: false
  struct_loss: bce_posweight
  struct_pos_weight: 4.0
  sampling: {}
training:
  output_dir: ./out/gate3-cold-words-s21
  experiment_name: gate3_cold_words_s21
  data_parallel: false
  num_epochs: 6
  seed: 21
  length_proxy: words
  batch_size: 8
  gradient_accumulation_steps: 2
  encoder_lr: 2.0e-05
  task_lr: 0.0005
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_classification_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  sliding_window: false
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false
  error_policy: skip
  on_capacity_exceeded: skip_sample
eval:
  threshold: 0.5
labels:
  entities:
    rollup: false
    separator: .
    map: {}
  relations:
    rollup: false
    separator: .
    map: {}
  events:
    rollup: false
    separator: .
    map: {}
data:
  corpora:
  - data/gate3
  event_files: {}
