# rolesym (control) -- GENERATED by tools/train/make_rolesym_configs.py from base/eb21.yaml; edit that, not this.
# Warm start eb21. TRAIN: exact eb21 replay without casie/rams_merged/wikievents (replay_eb21_rolesym) + those
# three in full. EVAL: eb21's own val/test files + app:news55, unchanged. control vs treatment: ONLY
# negative_gold_full_roles (False here). PARTIAL ANNOTATION is not extended to roles: the LLM-annotated
# cc_news corpora were annotated against the type's role menu, so an unargued role is read as absent there too.
model:
  pretrained: whr778/gliner2-eb21
  architecture: boundary
  max_len: 8192
  attn_implementation: flash_attention_2
  boundary_head:
    max_gold_per_query: 768
    training_candidate_budget: 768
    candidate_budget: 384
    start_top_k: 128
    end_top_k: 128
    candidate_pool: per_query
    enable_relations: true
    enable_records: true
    event_records: true
    record_role_hard_negatives: 8
    proposal_gold: identity
    record_link_mode: junction
    record_link_column_weight: 0.3
    record_coreferent_ownership: true
    record_coref_link: true
    record_coref_link_weight: 0.3
    record_coref_link_negatives: 4
training:
  negative_pools: tools/train/config/pools/eb21.negative_pools.json
  negative_labels_per_dim:
    entities: 20
    events: 20
  negative_label_seed: 42
  output_dir: ./out/rolesym-control
  experiment_name: rolesym_control
  data_parallel: false
  num_epochs: 2
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 1.0e-05
  task_lr: 0.0001
  warmup_ratio: 0.1
  scheduler_type: cosine
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_overall_strict_head_min_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 4
  validate_data: true
  sliding_window: true
  window_stride: 3072
  max_len: 4096
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  error_policy: skip
  on_capacity_exceeded: truncate_with_warning
  negative_gold_full_roles: false
eval:
  batch_size: 2
  threshold: 0.3
  threshold_sweep: false
  eval_by_language: true
  global_decode: true
  app_menus:
    news55: ../menus/news55.json
  menu: app:news55
labels_file: ../labels/unified-full-v3.yaml
data:
  corpora:
  - data/replay_eb21_rolesym
  - data/casie
  - data/rams_merged
  - data/wikievents
  train_only:
  - replay_eb21_rolesym
  - casie
  - rams_merged
  - wikievents
  partial_annotation:
    cmnee_ner:
    - entities
    cc_news_events_sonnet55_v2:
    - relations
  event_files:
    sentence_rex:
      val: data/sentence_rex.val.jsonl
      test: data/sentence_rex.test.jsonl
    bio_ner_relations:
      val: data/bio_ner_relations.val.jsonl
      test: data/bio_ner_relations.test.jsonl
    biored:
      val: data/biored.val.jsonl
      test: data/biored.test.jsonl
