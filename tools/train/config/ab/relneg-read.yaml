# relneg READ config -- professorbob_re only, for `sweep_menu_threshold.py --menu corpus_full --val-only`.
# Model/training sections are relneg-control's (unused by the read); data is cut to the one corpus read.
model:
  pretrained: whr778/gliner2-eb21
  architecture: boundary
  max_len: 8192
  attn_implementation: flash_attention_2
  boundary_head:
    max_gold_per_query: 768
    training_candidate_budget: 768
    candidate_budget: 384
    start_top_k: 128
    end_top_k: 128
    candidate_pool: per_query
    enable_relations: true
    enable_records: true
    event_records: true
    record_role_hard_negatives: 8
    proposal_gold: identity
    record_link_mode: junction
    record_link_column_weight: 0.3
    record_coreferent_ownership: true
    record_coref_link: true
    record_coref_link_weight: 0.3
    record_coref_link_negatives: 4
training:
  negative_pools: tools/train/config/pools/eb21.negative_pools.json
  negative_labels_per_dim:
    entities: 20
    events: 20
  negative_label_seed: 42
  output_dir: ./out/relneg-control
  experiment_name: relneg_control
  data_parallel: false
  num_epochs: 2
  batch_size: 4
  gradient_accumulation_steps: 4
  encoder_lr: 1.0e-05
  task_lr: 0.0001
  warmup_ratio: 0.1
  scheduler_type: cosine
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_overall_strict_head_min_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 4
  validate_data: true
  sliding_window: true
  window_stride: 3072
  max_len: 4096
  gradient_checkpointing: true
  pin_memory: true
  early_stopping: false
  error_policy: skip
  on_capacity_exceeded: truncate_with_warning
eval:
  batch_size: 2
  threshold: 0.3
  threshold_sweep: false
  eval_by_language: true
  global_decode: true
labels_file: ../labels/unified-full-v3.yaml
data:
  corpora:
  - data/professorbob_re
  train_only: []
  partial_annotation:
    cmnee_ner:
    - entities
    cc_news_events_sonnet55_v2:
    - relations
  event_files: {}
