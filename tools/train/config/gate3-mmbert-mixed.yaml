# COLLATOR ARM: identical to gate3-mmbert except `group_by_length`. ONE variable.
#
# WHY. `group_by_length` defaults TRUE and, for a boundary model, replaces shuffle
# entirely with LengthGroupedSampler (trainer.py:1765-1790). Document length correlates
# hard with language in this corpus -- median chars en 2,759 / tr 1,534 / zh 942 -- so
# length-grouped batches are de-facto language-grouped. Simulated on gate3.train.jsonl at
# batch_size 8:
#
#   window   mean dominant-lang share   batches 100% one language   padding waste
#        1                    0.660                        2.5%           50.9%
#       50 (gate3 as trained) 0.709                       14.6%            2.5%
#   random shuffle            0.662                        3.7%           50.9%
#
# So gate3 trained with ~4x more fully-monolingual batches than random shuffling would
# give. That is a curriculum difference, NOT a correctness bug: gate2-mmbert-tr,
# gate2-mmbert-v2 and every other boundary model here trained under the same default, so
# it is not a confound between those arms and it does not make gate3 "invalid".
#
# What it IS is an untested hypothesis -- does language-MIXED batching train a better
# multilingual gate? Nobody in this project has measured it. This arm measures it.
#
# CONTROL IS ALREADY TRAINED: whr778/gliner2-gate3-mmbert, same corpus, same seed, same
# recipe, group_by_length defaulted true. Nothing else may move.
#
# COST OF THE VARIABLE, known in advance: padding waste goes 2.5% -> 50.9%, so expect
# roughly 2x the wall-clock of the control's 2h25m. Deadline set accordingly.
#
# BARS, pre-registered, all against the control measured on the SAME instruments:
#   Turkish admission, 60 real held-out casualty_ml docs   control 58/60
#   Chinese admission, same 60                             control 59/60
#   English end-to-end pooled RMSE, Helene / Aegean / Turkiye-EN
#   test-set classification micro F1                       control 0.7739
# A win must not be read off one of these alone -- gate3 itself passed two bars and still
# regressed Helene.
model:
  encoder: jhu-clsp/mmBERT-base
  architecture: boundary
  max_len: 2048
  attn_implementation: flash_attention_2
  boundary_head:
    enable_relations: false
    enable_records: false
  struct_loss: bce_posweight
  struct_pos_weight: 4.0
  sampling: {}
training:
  output_dir: ./out/gate3-mmbert-mixed
  experiment_name: gate3_mmbert_mixedbatch
  data_parallel: false
  num_epochs: 8
  group_by_length: false   # THE SINGLE VARIABLE
  batch_size: 8
  gradient_accumulation_steps: 2
  encoder_lr: 2.0e-05
  task_lr: 0.0005
  warmup_ratio: 0.05
  scheduler_type: cosine_restarts
  bf16: true
  fp16: false
  max_grad_norm: 1.0
  eval_strategy: epoch
  metric_for_best: eval_classification_strict_micro_f1
  greater_is_better: true
  save_best: true
  save_total_limit: 2
  logging_steps: 20
  num_workers: 0
  validate_data: false
  sliding_window: false
  gradient_checkpointing: true
  pin_memory: false
  early_stopping: false
  error_policy: skip
  on_capacity_exceeded: skip_sample
eval:
  threshold: 0.5
labels:
  entities:
    rollup: false
    separator: .
    map: {}
  relations:
    rollup: false
    separator: .
    map: {}
  events:
    rollup: false
    separator: .
    map: {}
data:
  corpora:
  - data/gate3
  event_files: {}
